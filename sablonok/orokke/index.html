  const on = s => s && s.mutat !== false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HONAP = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];
  const NAP = ["vasárnap", "hétfő", "kedd", "szerda", "csütörtök", "péntek", "szombat"];
  const D = new Date(C.datum);
  const datumSzoveg = `${D.getFullYear()}. ${HONAP[D.getMonth()]} ${D.getDate()}.`;
  const nevek = `${C.nev1} & ${C.nev2}`;
  const monogram = C.nev1[0] + C.nev2[0];
  const DIV = '<svg class="divider" viewBox="0 0 140 24" aria-hidden="true"><path d="M2 12 H56 M84 12 H138" stroke="currentColor" stroke-width="1" opacity=".4"/><text x="70" y="17" text-anchor="middle" font-size="16" fill="currentColor">♡</text></svg>';
  const BRANCH = `<svg viewBox="0 0 320 320" aria-hidden="true"><path d="M10 10 C 80 60, 140 120, 200 230 S 280 300, 310 310"/>
    ${[[60, 46, -30], [100, 80, 20], [128, 110, -40], [160, 158, 15], [184, 196, -35], [222, 252, 25], [250, 276, -30]].map(([x, y, r], i) =>
      `<ellipse class="lf" cx="${x}" cy="${y}" rx="16" ry="7" transform="rotate(${r} ${x} ${y})" style="animation-delay:${0.6 + i * 0.22}s"/>`).join("")}</svg>`;

  document.documentElement.style.setProperty("--accent", C.szin);
  document.documentElement.style.setProperty("--sage", C.szin2);
  document.title = C.oldalCim;
  document.querySelector('meta[name="description"]').setAttribute("content", `${nevek} esküvője – ${datumSzoveg}, ${C.helyszinRovid}`);
  if (C.demo) document.getElementById("demo-bar").hidden = false;
  document.getElementById("env-names").textContent = nevek;
  document.getElementById("env-date").textContent = datumSzoveg;
  document.getElementById("seal").textContent = monogram;
  document.getElementById("foot-names").textContent = nevek;
  document.getElementById("foot-date").textContent = datumSzoveg + " · " + C.helyszinRovid;

  const html = [];
  html.push(`
  <section class="hero" id="top">
    <div class="branch l">${BRANCH}</div><div class="branch r">${BRANCH}</div>
    <div class="wrap">
      <span class="label fade">${esc(C.hero.felirat)}</span>
      <h1 class="names fade" style="animation-delay:.2s">${esc(C.nev1)}<span class="amp">&amp;</span>${esc(C.nev2)}</h1>
      <div class="date fade" style="animation-delay:.5s">${NAP[D.getDay()]} · ${datumSzoveg}</div>
      <div class="place fade" style="animation-delay:.6s">${esc(C.helyszinRovid)}</div>
      <p class="lead fade" style="animation-delay:.8s">${esc(C.hero.szoveg)}</p>
      <div class="ctas fade" style="animation-delay:1s"><a class="btn" href="#rsvp">${esc(C.hero.gomb)}</a><a class="btn ghost" href="#program">A nap menete</a></div>
    </div>
  </section>

  <section style="padding-top:40px">
    <div class="wrap">
      ${DIV}<span class="label rv">Már csak</span>
      <div class="count rv" id="count">${["nap", "óra", "perc", "mp"].map(u => `<div><b data-u="${u}">0</b><span>${u}</span></div>`).join("")}</div>
      <div class="cal-btns rv"><a class="btn ghost" id="ics" download="eskuvo.ics">Mentés a naptárba</a><a class="btn ghost" id="gcal" target="_blank" rel="noopener">Google Naptár</a></div>
    </div>
  </section>`);

  if (on(C.tortenet)) html.push(`
  <section>
    <div class="wrap">
      ${DIV}<span class="label rv">Mi így kezdtük</span><h2 class="script rv">${esc(C.tortenet.cim)}</h2>
      <div class="timeline" id="tline"><span class="fill" id="tfill"></span>
        ${C.tortenet.lepesek.map(l => `<div class="tl rv"><div class="yr">${esc(l.ev)}</div><div class="txt"><h3>${esc(l.cim)}</h3><p>${esc(l.szoveg)}</p></div></div>`).join("")}
      </div>
    </div>
  </section>`);

  const H = C.helyszin;
  html.push(`
  <section id="program" style="background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
    <div class="wrap">
      ${DIV}<span class="label rv">${datumSzoveg}</span><h2 class="script rv">${esc(C.program.cim)}</h2>
      <div class="prog rv">${C.program.elemek.map(p => `<div><b>${esc(p.ido)}</b><i>${esc(p.ikon)}</i><span>${esc(p.cim)}</span></div>`).join("")}</div>
    </div>
  </section>

  <section id="helyszin">
    <div class="wrap">
      ${DIV}<span class="label rv">Hol?</span><h2 class="script rv">A helyszín</h2>
      <div class="venue rv"><div class="pic"><span>${esc(monogram[0])} &amp; ${esc(monogram[1])}</span></div>
        <div class="body"><h3>${esc(H.nev)}</h3><div class="addr">${esc(H.cim)}</div>
          <dl>${H.info.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>
          ${H.terkepLink ? `<a class="btn" href="${esc(H.terkepLink)}" target="_blank" rel="noopener">Útvonal</a>` : `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(H.cim)}" target="_blank" rel="noopener">Útvonal</a>`}
        </div></div>
    </div>
  </section>`);

  if (on(C.dresscode)) html.push(`
  <section style="padding-top:20px">
    <div class="wrap">${DIV}<span class="label rv">Mit vegyek fel?</span><h2 class="script rv">${esc(C.dresscode.cim)}</h2>
      <p class="rv" style="max-width:560px;margin:-14px auto 0">${esc(C.dresscode.szoveg)}</p>
      <div class="swatches rv">${C.dresscode.szinek.map(c => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join("")}</div>
    </div>
  </section>`);

  if (on(C.gyik)) html.push(`
  <section style="padding-top:20px">
    <div class="wrap">${DIV}<span class="label rv">Kérdések</span><h2 class="script rv">Jó tudni</h2>
      <div class="faq rv">${C.gyik.elemek.map((f, i) => `<details${i === 0 ? " open" : ""}><summary>${esc(f.k)}</summary><p>${esc(f.v)}</p></details>`).join("")}</div>
    </div>
  </section>`);

  html.push(`
  <section class="rsvp" id="rsvp">
    <div class="wrap">
      ${DIV}<span class="label rv">Visszajelzés</span><h2 class="script rv">${esc(RS.cim)}</h2>
      <div class="rsvp-card rv">
        <p class="deadline">Kérjük, ${esc(RS.hatarido)}-ig jelezz vissza.</p>
        <form id="form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="${esc(RS.web3formsKulcs)}">
          <input type="hidden" name="subject" value="${esc(RS.urlapTargy + " – " + nevek)}">
          <input type="hidden" name="from_name" value="${esc(nevek + " esküvő")}">
          <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
          <div class="choice" role="radiogroup" aria-label="Részvétel">
            <label><input type="radio" name="Részvétel" value="Ott leszek" checked><span>Ott leszek!<small>Örömmel</small></span></label>
            <label><input type="radio" name="Részvétel" value="Sajnos nem tudok menni"><span>Sajnos nem…<small>Gondolatban ott leszek</small></span></label>
          </div>
          <div class="row2">
            <label class="flabel">Név *<input type="text" name="Név" required autocomplete="name"></label>
            <label class="flabel">E-mail *<input type="email" name="email" required autocomplete="email"></label>
          </div>
          <div class="only-yes" id="yes">
            <div class="row2">
              <label class="flabel">Hányan jöttök?<select name="Létszám">${[1, 2, 3, 4, 5].map(n => `<option>${n} fő</option>`).join("")}</select></label>
              <label class="flabel">Menü<select name="Menü">${RS.menu.map(m => `<option>${esc(m)}</option>`).join("")}</select></label>
            </div>
            <label class="flabel">Ételérzékenység, amiről tudnunk kell<input type="text" name="Ételérzékenység" placeholder="pl. gluténmentes"></label>
            <label class="flabel">Erre a számra biztosan táncolnék<input type="text" name="Zenekérés" placeholder="előadó – cím"></label>
          </div>
          <label class="flabel">Üzenet a párnak<textarea name="Üzenet"></textarea></label>
          <label class="consent"><input type="checkbox" required> Hozzájárulok, hogy adataimat az esküvő szervezéséhez kezeljék.</label>
          <div style="text-align:center"><button class="btn" id="send" type="submit">Visszajelzés küldése</button></div>
          <div class="msg" id="msg" role="status"></div>
        </form>
      </div>
      <p class="contact">${esc(RS.kapcsolat)}</p>
    </div>
  </section>`);

  document.getElementById("app").innerHTML = html.join("");

  /* --- Boríték --- */
  const env = document.getElementById("env"), envelope = document.getElementById("envelope");
  function start() { document.body.classList.remove("locked"); document.body.classList.add("ready"); }
  function openEnv() {
    if (envelope.classList.contains("open")) return;
    envelope.classList.add("open");
    setTimeout(() => { env.classList.add("gone"); start(); }, reduce ? 0 : 1900);
    setTimeout(() => env.remove(), reduce ? 50 : 3200);
  }
  if (!C.boritek || reduce) { env.remove(); start(); }
  else {
    envelope.addEventListener("click", openEnv);
    envelope.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnv(); } });
    document.getElementById("skip").onclick = () => { env.remove(); start(); };
  }

  /* --- Hulló szirmok --- */
  if (!reduce) {
    const pc = document.getElementById("petals"), cols = [C.szin2, "#f0d9cf", "#e9dfd2", C.szin];
    pc.innerHTML = Array.from({ length: innerWidth < 700 ? 8 : 16 }, (_, i) =>
      `<i class="petal" style="left:${(i * 61) % 100}%;--c:${cols[i % cols.length]};--t:${14 + (i % 5) * 3}s;--d:${-(i * 1.7)}s;scale:${0.7 + (i % 3) * 0.2}"></i>`).join("");
  }

  /* --- Visszaszámláló --- */
  const els = { nap: null, "óra": null, perc: null, mp: null };
  document.querySelectorAll("#count b").forEach(b => els[b.dataset.u] = b);
  function tick() {
    let s = Math.max(0, Math.floor((D - new Date()) / 1000));
    const v = { nap: Math.floor(s / 86400), "óra": Math.floor(s % 86400 / 3600), perc: Math.floor(s % 3600 / 60), mp: s % 60 };
    for (const k in v) { const t = String(v[k]).padStart(k === "nap" ? 1 : 2, "0"); if (els[k].textContent !== t) { els[k].textContent = t; if (!reduce) { els[k].classList.remove("tick"); void els[k].offsetWidth; els[k].classList.add("tick"); } } }
  }
  tick(); setInterval(tick, 1000);

  /* --- Naptárba mentés --- */
  const pad = n => String(n).padStart(2, "0");
  const stamp = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
  const end = new Date(D.getTime() + 10 * 3600 * 1000), title = `${nevek} esküvője`, loc = `${H.nev}, ${H.cim}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lydigital//Eskuvo//HU", "BEGIN:VEVENT", "UID:" + stamp(D) + "@eskuvo", "DTSTAMP:" + stamp(new Date()), "DTSTART:" + stamp(D), "DTEND:" + stamp(end), "SUMMARY:" + title, "LOCATION:" + loc, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  document.getElementById("ics").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  document.getElementById("gcal").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${stamp(D)}/${stamp(end)}&location=${encodeURIComponent(loc)}`;

  /* --- Idővonal kitöltése görgetésre --- */
  const tl = document.getElementById("tline"), tf = document.getElementById("tfill");
  if (tl && !reduce) addEventListener("scroll", () => { const r = tl.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight * .6 - r.top) / r.height)); tf.style.height = (p * 100) + "%"; }, { passive: true });

  /* --- Beúszás --- */
  const rv = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
    rv.forEach(el => io.observe(el));
  } else rv.forEach(el => el.classList.add("in"));

  /* --- RSVP --- */
  const form = document.getElementById("form"), yes = document.getElementById("yes");
  form.addEventListener("change", e => { if (e.target.name === "Részvétel") yes.classList.toggle("off", e.target.value !== "Ott leszek"); });
  function hearts() {
    if (reduce) return;
    for (let i = 0; i < 24; i++) { const h = document.createElement("span"); h.className = "heart"; h.textContent = "♥";
      h.style.cssText = `left:${Math.random() * 100}vw;top:${70 + Math.random() * 30}vh;font-size:${14 + Math.random() * 26}px;animation-delay:${Math.random() * .8}s;color:${i % 2 ? C.szin : C.szin2}`;
      document.body.appendChild(h); setTimeout(() => h.remove(), 3600); }
  }
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const b = document.getElementById("send"), m = document.getElementById("msg"), going = form.querySelector('[name="Részvétel"]:checked').value === "Ott leszek";
    b.disabled = true; m.className = "msg";
    try {
      const fd = new FormData(form); fd.set("replyto", fd.get("email") || "");
      if (!going) ["Létszám", "Menü", "Ételérzékenység", "Zenekérés"].forEach(k => fd.delete(k));
      const r = await fetch(form.action, { method: "POST", headers: { Accept: "application/json" }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.success) throw new Error(d.message || "HTTP " + r.status);
      form.reset(); yes.classList.remove("off"); m.className = "msg ok";
      m.textContent = going ? "Köszönjük! Nagyon várunk! ♥" : "Köszönjük, hogy jelezted – hiányozni fogsz!";
      if (going) hearts();
    } catch (err) {
      m.className = "msg err"; m.textContent = "Hiba történt a küldés közben. Kérjük, próbáld újra.";
    } finally { b.disabled = false; }
  });
})();
</script>
</body>
</html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2b28; --hot: #e8613c;
    --bg: #f3efe8; --card: #fbf9f5; --muted: #85817a; --line: #e2dcd2;
    --sans: "Bricolage Grotesque", system-ui, sans-serif; --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.noscroll { overflow: hidden; }
  a { color: inherit; }
  button { font-family: inherit; }
  em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--hot); }
  .wrap { max-width: 1260px; margin: 0 auto; padding: 0 24px; position: relative; }

  .demo-bar { background: var(--ink); color: #fff; font-size: 13px; text-align: center; padding: 8px 16px; }
  .demo-bar a { color: var(--hot); font-weight: 600; margin-left: 8px; white-space: nowrap; }
  .demo-bar[hidden] { display: none; }

  /* --- Fejléc --- */
  header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); }
  .nav { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .brand { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
  .brand strong { font: 800 26px var(--sans); letter-spacing: -.04em; }
  .brand span { font: italic 400 17px var(--serif); color: var(--muted); }
  .search { flex: 1; max-width: 360px; position: relative; }
  .search input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font: 400 15px var(--sans); color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--ink); }
  .search::before { content: "⌕"; position: absolute; left: 15px; top: 50%; transform: translateY(-52%); font-size: 18px; color: var(--muted); }
  .bag { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; border: 0; cursor: pointer; font: 600 15px var(--sans); }
  .bag .n { min-width: 22px; height: 22px; border-radius: 999px; background: var(--hot); display: grid; place-items: center; font-size: 12px; padding: 0 6px; }
  .bag.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 30% { transform: scale(1.18) rotate(-6deg); } }

  /* --- Hero --- */
  .hero { position: relative; padding: 30px 0 60px; overflow: hidden; }
  .marquee { white-space: nowrap; overflow: hidden; font: 800 clamp(70px, 13vw, 190px)/.9 var(--sans); letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.5px var(--ink); opacity: .18; user-select: none; }
  .marquee div { display: inline-block; animation: mq 40s linear infinite; }
  @keyframes mq { to { transform: translateX(-50%); } }
  .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: center; margin-top: -0.6em; }
  .hero h1 { font: 800 clamp(48px, 7vw, 104px)/.95 var(--sans); letter-spacing: -.045em; }
  .hero h1 em { font-size: 1.08em; letter-spacing: -.02em; }
  .hero p { font-size: 19px; color: var(--muted); max-width: 470px; margin: 22px 0 28px; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 999px; background: var(--hot); color: #fff; text-decoration: none; font: 600 16px var(--sans); border: 0; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px var(--hot); }
  .stage { position: relative; aspect-ratio: 1; max-width: 520px; justify-self: center; width: 100%; perspective: 900px; }
  .stage .disc { position: absolute; left: 10%; right: 10%; bottom: 8%; height: 18%; border-radius: 50%; background: radial-gradient(closest-side, #00000026, transparent); }
  .stage .ring { position: absolute; inset: 6%; border-radius: 50%; border: 1px dashed var(--line); animation: spin 60s linear infinite; }
  .stage .spin { position: absolute; inset: 12%; transform-style: preserve-3d; animation: turn 9s ease-in-out infinite; }
  .stage .spin svg { width: 100%; height: 100%; }
  @keyframes turn { 0%, 100% { transform: rotateY(-22deg) rotateX(4deg); } 50% { transform: rotateY(22deg) rotateX(-2deg) translateY(-12px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tag { position: absolute; padding: 10px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 14px; box-shadow: 0 16px 30px -20px rgba(0,0,0,.35); }
  .tag b { display: block; font: 800 22px var(--sans); letter-spacing: -.02em; }
  .tag.t1 { left: -2%; top: 18%; transform: rotate(-4deg); } .tag.t2 { right: 0; bottom: 18%; transform: rotate(5deg); }
  .sticker { position: absolute; right: 12%; top: 6%; width: 110px; height: 110px; border-radius: 50%; background: var(--hot); color: #fff; display: grid; place-items: center; text-align: center; font: 800 15px/1.1 var(--sans); animation: spin 18s linear infinite; }
  .sticker span { display: block; font: italic 400 30px var(--serif); }

  /* --- Szűrők --- */
  .shop { padding: 30px 0 100px; scroll-margin-top: 70px; }
  .shop-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .shop-head h2 { font: 800 clamp(40px, 5vw, 72px)/1 var(--sans); letter-spacing: -.04em; }
  .shop-head h2 em { font-size: 1.05em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px var(--sans); cursor: pointer; transition: background .2s, color .2s; }
  .chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips button sup { font-size: 10px; margin-left: 3px; opacity: .6; }
  .tools { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; }
  .tools select { padding: 9px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font: 500 14px var(--sans); color: var(--ink); }

  /* --- Termékrács (bento) --- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 360px; gap: 16px; }
  .p { position: relative; background: var(--card); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: 1px solid var(--line); transform-style: preserve-3d; transition: box-shadow .3s; }
  .p.big { grid-column: span 2; grid-row: span 2; }
  .p:hover { box-shadow: 0 30px 50px -34px rgba(0,0,0,.45); }
  .p .art { flex: 1; position: relative; display: grid; place-items: center; background: var(--tint); transition: background .5s; overflow: hidden; }
  .p .art svg, .p .art img { width: 78%; height: 78%; object-fit: contain; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .p.big .art svg { width: 70%; height: 70%; }
  .p:hover .art svg, .p:hover .art img { transform: translateY(-10px) rotate(-4deg) scale(1.04); }
  .p .badge { position: absolute; left: 14px; top: 14px; background: var(--hot); color: #fff; font: 600 12px var(--sans); padding: 5px 11px; border-radius: 999px; z-index: 2; }
  .p .badge.soft { background: var(--ink); }
  .p .info { padding: 14px 16px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .p h3 { font: 600 17px var(--sans); letter-spacing: -.01em; }
  .p.big h3 { font-size: 26px; }
  .p .price { font: 600 16px var(--sans); text-align: right; white-space: nowrap; }
  .p .price s { color: var(--muted); font-weight: 400; font-size: 13px; margin-right: 4px; }
  .p .price.sale { color: var(--hot); }
  .dots { display: flex; gap: 6px; }
  .dots button { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .dots button.on { box-shadow: 0 0 0 2px var(--ink); }
  .dots button:hover { transform: scale(1.15); }
  .add { justify-self: end; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 22px; cursor: pointer; transition: transform .2s, background .2s; display: grid; place-items: center; }
  .add:hover { background: var(--hot); transform: rotate(90deg); }
  .add:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; transform: none; }
  .p.out .art { filter: grayscale(.6) opacity(.7); }
  .p .out-label { position: absolute; inset: auto 0 50% 0; text-align: center; font: italic 400 28px var(--serif); color: var(--ink); z-index: 2; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 80px 0; color: var(--muted); font: italic 400 26px var(--serif); }

  /* --- Repülő pötty a kosárba --- */
  .fly { position: fixed; z-index: 100; width: 22px; height: 22px; border-radius: 50%; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.25); }

  /* --- Termék modal --- */
  .modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 20px; background: rgba(30,28,25,.45); backdrop-filter: blur(6px); }
  .modal.open { display: grid; animation: fadein .3s; }
  @keyframes fadein { from { opacity: 0; } }
  .sheet { width: min(980px, 100%); max-height: 92vh; overflow: auto; background: var(--card); border-radius: 32px; display: grid; grid-template-columns: 1.05fr .95fr; animation: pop .45s cubic-bezier(.2,1.2,.3,1); }
  @keyframes pop { from { transform: translateY(30px) scale(.96); opacity: 0; } }
  .sheet .art { background: var(--tint); display: grid; place-items: center; min-height: 460px; border-radius: 32px 0 0 32px; transition: background .5s; position: relative; }
  .sheet .art svg, .sheet .art img { width: 80%; max-height: 420px; animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-14px) rotate(2deg); } }
  .sheet .body { padding: 40px 36px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .sheet .x { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; }
  .sheet .cat { font: italic 400 20px var(--serif); color: var(--muted); }
  .sheet h3 { font: 800 40px/1 var(--sans); letter-spacing: -.035em; }
  .sheet .price { font: 600 26px var(--sans); }
  .sheet .price s { font-size: 18px; color: var(--muted); font-weight: 400; margin-right: 8px; }
  .sheet .desc { color: var(--muted); }
  .sheet .vlabel { font-size: 14px; color: var(--muted); }
  .sheet .dots button { width: 30px; height: 30px; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .qty button { width: 40px; height: 40px; border: 0; background: transparent; font-size: 18px; cursor: pointer; color: var(--ink); }
  .qty span { min-width: 30px; text-align: center; font-weight: 600; }
  .stock { font-size: 14px; color: var(--muted); }
  .stock.low { color: var(--hot); }

  /* --- Kosár fiók --- */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 90; width: min(440px, 100%); background: var(--card); box-shadow: -30px 0 60px -30px rgba(0,0,0,.35); transform: translateX(105%); transition: transform .5s cubic-bezier(.7,0,.2,1); display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 85; background: rgba(30,28,25,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .d-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--line); }
  .d-head h3 { font: 800 26px var(--sans); letter-spacing: -.03em; }
  .d-head button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 16px; }
  .d-body { flex: 1; overflow: auto; padding: 18px 24px; }
  .line { display: grid; grid-template-columns: 70px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); animation: slin .35s ease; }
  @keyframes slin { from { opacity: 0; transform: translateX(20px); } }
  .line .thumb { width: 70px; height: 70px; border-radius: 16px; background: var(--tint); display: grid; place-items: center; }
  .line .thumb svg, .line .thumb img { width: 80%; height: 80%; object-fit: contain; }
  .line b { display: block; font-weight: 600; }
  .line small { color: var(--muted); }
  .line .r { text-align: right; display: grid; gap: 6px; justify-items: end; }
  .line .qty button { width: 30px; height: 30px; } .line .qty span { min-width: 22px; font-size: 14px; }
  .free { padding: 14px 24px; background: color-mix(in srgb, var(--hot) 8%, var(--card)); font-size: 14px; }
  .free .bar { height: 6px; border-radius: 6px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .free .bar i { display: block; height: 100%; background: var(--hot); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .d-foot { padding: 20px 24px 24px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
  .sum { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .sum.total { color: var(--ink); font: 800 24px var(--sans); letter-spacing: -.02em; }
  .d-foot .cta { justify-content: center; width: 100%; }
  .d-empty { text-align: center; padding: 60px 10px; color: var(--muted); font: italic 400 24px var(--serif); }
  .co { display: grid; gap: 12px; }
  .co label { min-width: 0; display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .co input:not([type=checkbox]):not([type=radio]), .co select, .co textarea { width: 100%; min-width: 0; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font: 400 15px var(--sans); color: var(--ink); outline: none; }
  .co input:focus, .co select:focus, .co textarea:focus { border-color: var(--ink); }
  .co .row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .co .opt { display: grid; gap: 6px; }
  .co .opt label { flex-direction: row; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .co .opt label span { margin-left: auto; color: var(--muted); }
  .co .opt input { accent-color: var(--hot); }
  .co .consent { display: flex; flex-direction: row; gap: 8px; align-items: flex-start; font-weight: 400; }
  .co .consent input { accent-color: var(--hot); margin-top: 3px; }
  .back { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 14px; justify-self: start; }
  .hp { position: absolute; left: -9999px; }
  .done { text-align: center; padding: 50px 10px; }
  .done .big { font: italic 400 54px var(--serif); color: var(--hot); }
  .done code { display: inline-block; margin: 10px 0; padding: 6px 14px; background: var(--bg); border-radius: 10px; font: 600 18px var(--sans); }
  .err { color: #b4361b; font-size: 14px; }

  /* --- Előnyök sáv + lábléc --- */
  .perks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 0 0 90px; }
  .perks div { padding: 24px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
  .perks b { display: block; font: 800 20px var(--sans); letter-spacing: -.02em; margin: 6px 0 2px; }
  .perks span { color: var(--muted); font-size: 14px; }
  .perks i { font-style: normal; font-size: 24px; }
  footer { background: var(--ink); color: #c9c4bb; padding: 50px 0 34px; font-size: 14px; }
  footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 30px; margin-bottom: 30px; }
  footer strong.logo { font: 800 40px var(--sans); color: #fff; letter-spacing: -.04em; display: block; }
  footer a { text-decoration: none; } footer a:hover { color: #fff; }
  footer ul { list-style: none; display: grid; gap: 6px; }
  footer .bottom { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid #ffffff1a; padding-top: 20px; }
  footer .credit strong { color: #fff; } footer .credit:hover strong { color: var(--hot); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 320px; }
    .hero-grid { grid-template-columns: 1fr; }
    .stage { max-width: 400px; }
    .perks { grid-template-columns: 1fr 1fr; }
    .sheet { grid-template-columns: 1fr; } .sheet .art { min-height: 300px; border-radius: 32px 32px 0 0; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .nav { flex-wrap: wrap; height: auto; padding: 12px 16px; }
    .shop { scroll-margin-top: 130px; }
    .search { order: 3; max-width: none; flex-basis: 100%; }
    .bag .t { display: none; }
    .grid { grid-auto-rows: 260px; gap: 10px; }
    .p { border-radius: 22px; }
    .p.big { grid-row: span 1; }
    .p .info { padding: 10px 12px 12px; } .p h3 { font-size: 15px; } .p.big h3 { font-size: 18px; }
    .p .dots { display: none; } .p.big .dots { display: flex; }
    .add { width: 36px; height: 36px; font-size: 18px; position: absolute; right: 10px; top: 10px; z-index: 3; }
    .p .info { grid-template-columns: 1fr; gap: 2px; }
    .p .price { text-align: left; }
    .p .badge { left: 10px; top: 10px; }
    .tag, .sticker { display: none; }
    footer .cols { grid-template-columns: 1fr; }
    .perks { grid-template-columns: 1fr; }
    .sheet .body { padding: 26px 20px; } .sheet h3 { font-size: 30px; }
    .co .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden>Ez egy <strong>Lydigital</strong> mintaoldal – a bolt és a termékek kitaláltak, a rendelés nem valódi. <a href="https://lydigital.hu/#sablonok">Ilyet szeretnék →</a></div>

<header>
  <div class="wrap nav">
    <a href="#" class="brand"><strong id="brand"></strong><span id="sub"></span></a>
    <label class="search"><input type="search" id="q" placeholder="Keresés a termékek között…" aria-label="Keresés"></label>
    <button class="bag" id="bag" type="button" aria-label="Kosár megnyitása"><span class="t">Kosár</span><span class="n" id="bag-n">0</span></button>
  </div>
</header>

<main id="app"></main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Kosár">
  <div class="d-head"><h3 id="d-title">Kosár</h3><button type="button" id="d-close" aria-label="Bezárás">✕</button></div>
  <div class="free" id="free"></div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot" id="d-foot"></div>
</aside>

<footer>
  <div class="wrap">
    <div class="cols">
      <div><strong class="logo" id="f-logo"></strong><p id="f-sub"></p></div>
      <ul id="f-contact"></ul>
      <ul id="f-legal"></ul>
    </div>
    <div class="bottom"><span id="f-copy"></span><a class="credit" href="https://lydigital.hu/" target="_blank" rel="noopener">Designed by <strong>Lydigital</strong></a></div>
  </div>
</footer>

<script>
(function () {
  const C = CONFIG, K = C.kapcsolat, P = C.termekek;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + C.penznem;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const price = p => p.akcioAr || p.ar;
  P.forEach((p, i) => { p.id = i; p.v = 0; });

  /* --- Színsegédek a rajzolt termékképekhez --- */
  const shade = (hex, amt) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
    return "#" + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, "0")).join(""); };
  const tint = hex => `radial-gradient(120% 90% at 50% 20%, ${shade(hex, .82)}, ${shade(hex, .6)})`;

  /* --- Termékrajz (SVG), ha nincs fotó --- */
  let uid = 0;
  function art(p, vi) {
    const v = p.valtozatok[vi ?? p.v] || p.valtozatok[0];
    if (v.kep || p.kep) return `<img src="${esc(v.kep || p.kep)}" alt="${esc(p.nev)} – ${esc(v.nev)}" loading="lazy">`;
    const c = v.szin, d = shade(c, -.28), l = shade(c, .35), id = "g" + (uid++);
    const defs = `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${d}"/><stop offset=".38" stop-color="${l}"/><stop offset=".62" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>`;
    const sh = `<ellipse cx="100" cy="182" rx="62" ry="9" fill="#0000001f"/>`;
    const F = `fill="url(#${id})"`;
    const shapes = {
      bogre: `<path d="M136 78 q34 2 32 32 q-2 28 -34 28" fill="none" stroke="${d}" stroke-width="11"/><path d="M48 60 h92 v92 q0 26 -26 26 h-40 q-26 0 -26 -26 z" ${F}/><ellipse cx="94" cy="60" rx="46" ry="9" fill="${shade(c, -.45)}"/><ellipse cx="94" cy="59" rx="40" ry="6" fill="${shade(c, -.6)}"/>`,
      vaza: `<path d="M84 26 h32 v12 q-2 12 10 26 q30 34 22 76 q-6 36 -48 40 q-42 -4 -48 -40 q-8 -42 22 -76 q12 -14 10 -26 z" ${F}/><ellipse cx="100" cy="27" rx="16" ry="4" fill="${shade(c, -.5)}"/><path d="M98 26 q-4 -16 6 -26 M104 26 q10 -14 22 -12" stroke="#6f7f62" stroke-width="3" fill="none"/>`,
      gyertya: `<path d="M50 70 h100 v86 q0 22 -22 22 h-56 q-22 0 -22 -22 z" ${F}/><ellipse cx="100" cy="70" rx="50" ry="10" fill="#efe6d6"/><ellipse cx="100" cy="72" rx="44" ry="7" fill="#e3d6c0"/><path d="M100 70 v-12" stroke="#3a3027" stroke-width="2"/><path class="flame" d="M100 30 q12 14 0 28 q-12 -14 0 -28" fill="#f4b04b"/><rect x="62" y="104" width="76" height="36" rx="6" fill="#fffaf2" opacity=".85"/><path d="M76 122 h48" stroke="${d}" stroke-width="2"/>`,
      tal: `<path d="M26 92 h148 q-6 64 -74 72 q-68 -8 -74 -72 z" ${F}/><ellipse cx="100" cy="92" rx="74" ry="16" fill="${shade(c, .15)}"/><ellipse cx="100" cy="94" rx="64" ry="11" fill="${shade(c, -.2)}"/>`,
      palack: `<path d="M80 74 q-26 8 -26 44 v34 q0 26 26 26 h40 q26 0 26 -26 v-34 q0 -36 -26 -44 v-16 h-40 z" ${F}/><rect x="80" y="54" width="40" height="8" rx="3" fill="${shade(c, -.4)}"/><path d="M92 54 l-14 -46 M100 54 l0 -50 M108 54 l16 -44" stroke="#8a6a46" stroke-width="3" stroke-linecap="round"/>`,
      tanyer: `<ellipse cx="100" cy="112" rx="84" ry="56" ${F}/><ellipse cx="100" cy="108" rx="58" ry="36" fill="${shade(c, .2)}"/>${[[70, 96], [118, 92], [96, 120], [132, 118], [76, 126], [108, 104]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="${shade(c, -.45)}"/>`).join("")}`
    };
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.nev)} – ${esc(v.nev)}">${defs}${sh}${shapes[p.forma] || shapes.bogre}</svg>`;
  }

  /* --- Alapok --- */
  document.documentElement.style.setProperty("--ink", C.szin);
  document.documentElement.style.setProperty("--hot", C.szin2);
  document.title = C.seoCim;
  document.querySelector('meta[name="description"]').setAttribute("content", C.seoLeiras);
  if (C.demo) $("demo-bar").hidden = false;
  $("brand").textContent = C.bolt; $("sub").textContent = C.alcim; $("f-logo").textContent = C.bolt; $("f-sub").textContent = C.alcim;
  $("f-copy").textContent = "© " + new Date().getFullYear() + " " + C.bolt;
  $("f-contact").innerHTML = `<li><a href="mailto:${esc(K.email)}">${esc(K.email)}</a></li><li><a href="tel:${esc(K.telefon.replace(/\s/g, ""))}">${esc(K.telefon)}</a></li><li>${esc(K.cim)}</li>`;
  $("f-legal").innerHTML = `<li><a href="${esc(K.aszf)}">ÁSZF</a></li><li><a href="${esc(K.adatkezeles)}">Adatkezelési tájékoztató</a></li><li><a href="${esc(K.impresszum)}">Impresszum</a></li>`;

  const ld = { "@context": "https://schema.org", "@graph": [{ "@type": "Store", name: C.bolt, description: C.seoLeiras, url: C.domain, email: K.email, telephone: K.telefon },
    ...P.map(p => ({ "@type": "Product", name: p.nev, description: p.leiras, category: p.kategoria,
      offers: { "@type": "Offer", price: price(p), priceCurrency: "HUF", availability: "https://schema.org/" + (p.keszlet > 0 ? "InStock" : "OutOfStock") } }))] };
  const ldS = document.createElement("script"); ldS.type = "application/ld+json"; ldS.textContent = JSON.stringify(ld); document.head.appendChild(ldS);

  /* --- Oldal --- */
  const hp = P[C.hero.kiemeltTermek] || P[0];
  const cats = ["Mind", ...new Set(P.map(p => p.kategoria))];
  const mq = (C.hero.futoSzoveg + " ").repeat(4);
  $("app").innerHTML = `
  <section class="hero">
    <div class="marquee" aria-hidden="true"><div>${esc(mq)}${esc(mq)}</div></div>
    <div class="wrap hero-grid">
      <div>
        <h1>${esc(C.hero.cim).replace(/\*([^*]+)\*/g, "<em>$1</em>")}</h1>
        <p>${esc(C.hero.szoveg)}</p>
        <a class="cta" href="#bolt">Irány a bolt <span>→</span></a>
      </div>
      <div class="stage" aria-hidden="true">
        <div class="ring"></div><div class="disc"></div>
        <div class="spin" id="hero-art">${art(hp)}</div>
        <div class="tag t1"><span>${esc(hp.kategoria)}</span><b>${esc(hp.nev)}</b></div>
        <div class="tag t2"><span>már</span><b>${money(price(hp))}</b></div>
        <div class="sticker"><div>kézzel<span>készült</span></div></div>
      </div>
    </div>
  </section>

  <section class="shop" id="bolt">
    <div class="wrap">
      <div class="shop-head">
        <h2>A <em>vitrin</em></h2>
        <div class="chips" id="chips">${cats.map((c, i) => `<button type="button" data-c="${esc(c)}" class="${i ? "" : "on"}">${esc(c)}<sup>${c === "Mind" ? P.length : P.filter(p => p.kategoria === c).length}</sup></button>`).join("")}</div>
        <div class="tools"><span id="count"></span><select id="sort" aria-label="Rendezés"><option value="">Ajánlott</option><option value="asc">Ár szerint ↑</option><option value="desc">Ár szerint ↓</option><option value="name">Név szerint</option></select></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="wrap perks">
    <div><i>🚚</i><b>2–4 nap</b><span>szállítás az ország egész területére</span></div>
    <div><i>🎁</i><b>${money(C.ingyenesSzallitasTol)} felett</b><span>ingyenes szállítás</span></div>
    <div><i>🤲</i><b>Kézzel készült</b><span>minden darab egyedi</span></div>
    <div><i>↩︎</i><b>14 nap</b><span>elállási jog, gond nélkül</span></div>
  </div>`;

  /* --- Szűrés, keresés, rendezés (FLIP animációval) --- */
  let cat = "Mind", query = "", sort = "";
  const grid = $("grid");
  function cardHTML(p, big) {
    const v = p.valtozatok[p.v], out = p.keszlet <= 0;
    return `<article class="p${big ? " big" : ""}${out ? " out" : ""}" data-id="${p.id}" style="--tint:${tint(v.szin)}">
      ${p.jelveny ? `<span class="badge${p.jelveny === "Akció" ? "" : " soft"}">${esc(p.jelveny)}</span>` : ""}
      <div class="art">${art(p)}${out ? `<span class="out-label">Elfogyott</span>` : ""}</div>
      <div class="info">
        <h3>${esc(p.nev)}</h3>
        <div class="price${p.akcioAr ? " sale" : ""}">${p.akcioAr ? `<s>${money(p.ar)}</s>` : ""}${money(price(p))}</div>
        <div class="dots">${p.valtozatok.map((x, i) => `<button type="button" data-v="${i}" class="${i === p.v ? "on" : ""}" style="background:${esc(x.szin)}" aria-label="${esc(x.nev)}" title="${esc(x.nev)}"></button>`).join("")}</div>
        <button type="button" class="add" data-add="${p.id}" aria-label="${esc(p.nev)} kosárba" ${out ? "disabled" : ""}>+</button>
      </div>
    </article>`;
  }
  function list() {
    let r = P.filter(p => (cat === "Mind" || p.kategoria === cat) && (!query || (p.nev + " " + p.kategoria + " " + p.leiras).toLowerCase().includes(query)));
    if (sort === "asc") r = [...r].sort((a, b) => price(a) - price(b));
    if (sort === "desc") r = [...r].sort((a, b) => price(b) - price(a));
    if (sort === "name") r = [...r].sort((a, b) => a.nev.localeCompare(b.nev, "hu"));
    return r;
  }
  function render(animate) {
    const first = {}; if (animate && !reduce) grid.querySelectorAll(".p").forEach(el => first[el.dataset.id] = el.getBoundingClientRect());
    const r = list();
    grid.innerHTML = r.length ? r.map((p, i) => cardHTML(p, i === 0 && cat === "Mind" && !query && !sort)).join("") : `<div class="empty">Nincs ilyen termék – próbálj másik keresést.</div>`;
    $("count").textContent = r.length + " termék";
    if (animate && !reduce) grid.querySelectorAll(".p").forEach((el, i) => {
      const a = first[el.dataset.id], b = el.getBoundingClientRect();
      if (a) el.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, transformOrigin: "top left" }, { transform: "none", transformOrigin: "top left" }], { duration: 550, easing: "cubic-bezier(.2,.8,.2,1)" });
      else el.animate([{ opacity: 0, transform: "scale(.85) translateY(20px)" }, { opacity: 1, transform: "none" }], { duration: 450, delay: i * 30, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
    });
    bindTilt();
  }
  $("chips").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; cat = b.dataset.c; document.querySelectorAll("#chips button").forEach(x => x.classList.toggle("on", x === b)); render(true); });
  $("sort").addEventListener("change", e => { sort = e.target.value; render(true); });
  let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value.trim().toLowerCase(); if (query) document.getElementById("bolt").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); render(true); }, 180); });

  /* --- 3D billenés a kártyákon --- */
  function bindTilt() {
    if (reduce || !matchMedia("(pointer: fine)").matches) return;
    grid.querySelectorAll(".p").forEach(c => {
      c.onmousemove = e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `perspective(900px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`; };
      c.onmouseleave = () => c.style.transform = "";
    });
  }

  /* --- Kártya: színváltás, kosárba, részletek --- */
  grid.addEventListener("click", e => {
    const card = e.target.closest(".p"); if (!card) return; const p = P[+card.dataset.id];
    const vb = e.target.closest("[data-v]");
    if (vb) { e.stopPropagation(); p.v = +vb.dataset.v; card.style.setProperty("--tint", tint(p.valtozatok[p.v].szin)); card.querySelector(".art").innerHTML = art(p) + (p.keszlet <= 0 ? `<span class="out-label">Elfogyott</span>` : ""); card.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("on", x === vb)); return; }
    const ab = e.target.closest("[data-add]");
    if (ab) { e.stopPropagation(); addToCart(p, p.v, 1, ab); return; }
    openProduct(p);
  });

  /* --- Termék részletek --- */
  const modal = $("modal"), sheet = $("sheet"); let mq_ = 1;
  function openProduct(p) {
    mq_ = 1;
    const draw = () => {
      const v = p.valtozatok[p.v], out = p.keszlet <= 0;
      sheet.innerHTML = `<div class="art" style="--tint:${tint(v.szin)}">${art(p)}</div>
        <div class="body"><button class="x" type="button" data-close aria-label="Bezárás">✕</button>
          <span class="cat">${esc(p.kategoria)}</span><h3>${esc(p.nev)}</h3>
          <div class="price">${p.akcioAr ? `<s>${money(p.ar)}</s>` : ""}${money(price(p))}</div>
          <p class="desc">${esc(p.leiras)}</p>
          <span class="vlabel">Szín: <b>${esc(v.nev)}</b></span>
          <div class="dots">${p.valtozatok.map((x, i) => `<button type="button" data-mv="${i}" class="${i === p.v ? "on" : ""}" style="background:${esc(x.szin)}" aria-label="${esc(x.nev)}"></button>`).join("")}</div>
          <span class="stock${p.keszlet > 0 && p.keszlet <= 5 ? " low" : ""}">${out ? "Jelenleg elfogyott" : p.keszlet <= 5 ? `Már csak ${p.keszlet} db raktáron!` : "Raktáron"}</span>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <div class="qty"><button type="button" data-mq="-1" aria-label="Kevesebb">−</button><span id="mq">${mq_}</span><button type="button" data-mq="1" aria-label="Több">+</button></div>
            <button type="button" class="cta" data-madd ${out ? "disabled style=\"opacity:.4;cursor:not-allowed\"" : ""}>Kosárba · ${money(price(p) * mq_)}</button>
          </div></div>`;
    };
    draw();
    sheet.onclick = e => {
      if (e.target.closest("[data-close]")) return closeModal();
      const mv = e.target.closest("[data-mv]"); if (mv) { p.v = +mv.dataset.mv; draw(); render(false); return; }
      const q = e.target.closest("[data-mq]"); if (q) { mq_ = Math.max(1, Math.min(p.keszlet || 1, mq_ + +q.dataset.mq)); draw(); return; }
      const a = e.target.closest("[data-madd]"); if (a && !a.disabled) { addToCart(p, p.v, mq_, a); setTimeout(closeModal, reduce ? 0 : 450); }
    };
    modal.classList.add("open"); document.body.classList.add("noscroll");
  }
  function closeModal() { modal.classList.remove("open"); document.body.classList.remove("noscroll"); }
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeCart(); } });

  /* --- Kosár (a böngészőben megjegyezve) --- */
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem("vitrin-cart") || "[]").filter(l => P[l.id]); } catch (e) {}
  const save = () => { try { localStorage.setItem("vitrin-cart", JSON.stringify(cart)); } catch (e) {} };
  const sub = () => cart.reduce((a, l) => a + price(P[l.id]) * l.db, 0);
  function addToCart(p, v, db, fromEl) {
    const ex = cart.find(l => l.id === p.id && l.v === v);
    if (ex) ex.db = Math.min(p.keszlet, ex.db + db); else cart.push({ id: p.id, v, db: Math.min(p.keszlet, db) });
    save(); updBag();
    const bag = $("bag");
    if (!reduce && fromEl) {
      const a = fromEl.getBoundingClientRect(), b = bag.getBoundingClientRect(), dot = document.createElement("div");
      dot.className = "fly"; dot.style.background = p.valtozatok[v].szin; document.body.appendChild(dot);
      const x0 = a.left + a.width / 2 - 11, y0 = a.top + a.height / 2 - 11, x1 = b.left + b.width - 22, y1 = b.top + 4, mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 160;
      const pts = Array.from({ length: 13 }, (_, i) => { const t = i / 12, x = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * mx + t * t * x1, y = (1 - t) ** 2 * y0 + 2 * (1 - t) * t * my + t * t * y1;
        return { transform: `translate(${x}px, ${y}px) scale(${1 - t * .5})` }; });
      dot.animate(pts, { duration: 750, easing: "cubic-bezier(.5,0,.6,1)" }).onfinish = () => { dot.remove(); bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump"); };
    } else { bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump"); }
  }
  function updBag() { $("bag-n").textContent = cart.reduce((a, l) => a + l.db, 0); if ($("drawer").classList.contains("open") && step === "cart") drawCart(); }
  updBag();

  const drawer = $("drawer"), scrim = $("scrim"); let step = "cart";
  function openCart() { step = "cart"; drawCart(); drawer.classList.add("open"); scrim.classList.add("on"); document.body.classList.add("noscroll"); }
  function closeCart() { drawer.classList.remove("open"); scrim.classList.remove("on"); if (!modal.classList.contains("open")) document.body.classList.remove("noscroll"); }
  $("bag").onclick = openCart; $("d-close").onclick = closeCart; scrim.onclick = closeCart;

  function freeBar() {
    const s = sub(), left = C.ingyenesSzallitasTol - s, pct = Math.min(100, s / C.ingyenesSzallitasTol * 100);
    $("free").innerHTML = (left > 0 ? `Még <b>${money(left)}</b>, és ingyenes a szállítás!` : `🎉 Ingyenes szállítás jár a rendelésedhez!`) + `<div class="bar"><i style="width:${pct}%"></i></div>`;
    $("free").style.display = cart.length ? "" : "none";
  }
  function drawCart() {
    $("d-title").textContent = "Kosár"; freeBar();
    const body = $("d-body"), foot = $("d-foot");
    if (!cart.length) { body.innerHTML = `<div class="d-empty">Még üres a kosarad.<br>Nézz körül a vitrinben!</div>`; foot.innerHTML = `<button class="cta" type="button" data-shop>Vissza a vásárláshoz</button>`; return; }
    body.innerHTML = cart.map((l, i) => { const p = P[l.id], v = p.valtozatok[l.v];
      return `<div class="line"><div class="thumb" style="--tint:${tint(v.szin)}">${art(p, l.v)}</div><div><b>${esc(p.nev)}</b><small>${esc(v.nev)} · ${money(price(p))}</small></div>
        <div class="r"><strong>${money(price(p) * l.db)}</strong><div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="Kevesebb">−</button><span>${l.db}</span><button type="button" data-q="${i}" data-d="1" aria-label="Több">+</button></div></div></div>`; }).join("");
    foot.innerHTML = `<div class="sum"><span>Részösszeg</span><span>${money(sub())}</span></div><div class="sum"><span>Szállítás</span><span>a következő lépésben</span></div>
      <button class="cta" type="button" data-checkout>Tovább a rendeléshez →</button>`;
  }
  drawer.addEventListener("click", e => {
    const q = e.target.closest("[data-q]");
    if (q) { const l = cart[+q.dataset.q]; l.db += +q.dataset.d; if (l.db <= 0) cart.splice(+q.dataset.q, 1); else l.db = Math.min(P[l.id].keszlet, l.db); save(); updBag(); drawCart(); return; }
    if (e.target.closest("[data-shop]")) { closeCart(); $("bolt").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); return; }
    if (e.target.closest("[data-checkout]")) { step = "checkout"; drawCheckout(); return; }
    if (e.target.closest("[data-back]")) { step = "cart"; drawCart(); return; }
  });

  /* --- Rendelés leadása --- */
  function totals(form) {
    const sz = C.szallitas[+(form?.querySelector('[name="szall"]:checked')?.value || 0)];
    const fiz = form?.querySelector('[name="Fizetés"]:checked')?.value || C.fizetes[0];
    const ship = sub() >= C.ingyenesSzallitasTol ? 0 : sz.ar, cod = /utánvét/i.test(fiz) ? 390 : 0;
    return { sz, fiz, ship, cod, total: sub() + ship + cod };
  }
  function drawCheckout() {
    $("d-title").textContent = "Rendelés"; $("free").style.display = "none";
    $("d-body").innerHTML = `<form class="co" id="co" action="https://api.web3forms.com/submit" method="POST" novalidate>
      <input type="hidden" name="access_key" value="${esc(K.web3formsKulcs)}">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <button type="button" class="back" data-back>← vissza a kosárhoz</button>
      <div class="row2"><label>Név *<input name="Név" required autocomplete="name"></label><label>Telefon *<input name="Telefon" type="tel" required autocomplete="tel"></label></div>
      <label>E-mail *<input name="email" type="email" required autocomplete="email"></label>
      <label>Szállítási cím *<input name="Cím" required autocomplete="street-address" placeholder="irányítószám, település, utca, házszám"></label>
      <label>Szállítás</label>
      <div class="opt">${C.szallitas.map((s, i) => `<label><input type="radio" name="szall" value="${i}" ${i ? "" : "checked"}>${esc(s.nev)}<span>${s.ar ? money(s.ar) : "ingyenes"}</span></label>`).join("")}</div>
      <label>Fizetés</label>
      <div class="opt">${C.fizetes.map((f, i) => `<label><input type="radio" name="Fizetés" value="${esc(f)}" ${i ? "" : "checked"}>${esc(f)}</label>`).join("")}</div>
      <label>Megjegyzés<textarea name="Megjegyzés" rows="2"></textarea></label>
      <label class="consent"><input type="checkbox" required> Elfogadom az <a href="${esc(K.aszf)}" target="_blank">ÁSZF</a>-et és az <a href="${esc(K.adatkezeles)}" target="_blank">adatkezelési tájékoztatót</a>.</label>
      <div class="err" id="co-err"></div>
    </form>`;
    const form = $("co");
    const foot = () => { const t = totals(form);
      $("d-foot").innerHTML = `<div class="sum"><span>Termékek</span><span>${money(sub())}</span></div><div class="sum"><span>Szállítás</span><span>${t.ship ? money(t.ship) : "ingyenes"}</span></div>${t.cod ? `<div class="sum"><span>Utánvét díja</span><span>${money(t.cod)}</span></div>` : ""}
        <div class="sum total"><span>Összesen</span><span>${money(t.total)}</span></div><button class="cta" type="button" id="place">Megrendelem</button>`;
      $("place").onclick = place; };
    form.addEventListener("change", foot); foot();
  }
  async function place() {
    const form = $("co"), err = $("co-err"), btn = $("place");
    if (!form.checkValidity()) { err.textContent = "Kérjük, tölts ki minden kötelező mezőt, és fogadd el az ÁSZF-et."; form.reportValidity(); return; }
    const t = totals(form), id = "R" + Date.now().toString(36).toUpperCase().slice(-6);
    const fd = new FormData(form);
    fd.delete("szall");
    fd.set("subject", `${K.urlapTargy} – ${id} – ${money(t.total)}`);
    fd.set("from_name", C.bolt + " webshop"); fd.set("replyto", fd.get("email") || "");
    fd.set("Rendelésszám", id);
    fd.set("Tételek", cart.map(l => { const p = P[l.id]; return `${l.db} × ${p.nev} (${p.valtozatok[l.v].nev}) – ${money(price(p) * l.db)}`; }).join("\n"));
    fd.set("Szállítási mód", t.sz.nev + " – " + (t.ship ? money(t.ship) : "ingyenes"));
    fd.set("Végösszeg", money(t.total));
    btn.disabled = true; btn.textContent = "Küldés…"; err.textContent = "";
    try {
      const r = await fetch(form.action, { method: "POST", headers: { Accept: "application/json" }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.success) throw new Error(d.message || "HTTP " + r.status);
      cart = []; save(); updBag(); step = "done";
      $("d-title").textContent = "Köszönjük!";
      $("d-body").innerHTML = `<div class="done"><div class="big">Megkaptuk!</div><p>Rendelésszám:</p><code>${id}</code><p>Visszaigazolást küldünk e-mailben${/utal/i.test(t.fiz) ? " az utalási adatokkal" : ""}.</p></div>`;
      $("d-foot").innerHTML = `<button class="cta" type="button" data-shop>Vissza a vitrinhez</button>`;
    } catch (e) { err.textContent = "Hiba történt a küldés közben. Kérjük, próbáld újra, vagy írj nekünk e-mailt."; btn.disabled = false; btn.textContent = "Megrendelem"; }
  }

  render(false);
})();
</script>
</body>
</html>

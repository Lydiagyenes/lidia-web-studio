<style>
  :root {
    --accent: #b5577a;
    --gold: #c9a27a;
    --bg: #fbf6f2;
    --blush: #f4e4dc;
    --card: #fffaf7;
    --ink: #3b2a2f;
    --muted: #8a7377;
    --line: #ecdcd4;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
    --max: 1180px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font: 300 17px/1.7 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.05; }
  em { font-style: italic; color: var(--accent); }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
  section { padding: 120px 0; position: relative; }
  .kicker { font: 400 13px var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 12px; }
  .kicker::before { content: ""; width: 28px; height: 1px; background: var(--gold); }
  .head { text-align: center; max-width: 640px; margin: 0 auto 64px; }
  .head h2 { font-size: clamp(44px, 6vw, 76px); margin: 14px 0 12px; }
  .head p { color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px; border-radius: 999px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: 400 15px var(--sans); letter-spacing: .06em; text-decoration: none; cursor: pointer;
    position: relative; overflow: hidden; transition: transform .25s, box-shadow .25s;
  }
  .btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .8s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -12px var(--accent); }
  .btn:hover::after { transform: translateX(120%); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }

  /* --- Demó sáv --- */
  .demo-bar { background: var(--ink); color: #fff; font-size: 13px; text-align: center; padding: 9px 16px; position: relative; z-index: 30; }
  .demo-bar a { color: #fff; font-weight: 500; margin-left: 8px; white-space: nowrap; }
  .demo-bar[hidden] { display: none; }

  /* --- Header --- */
  header { position: sticky; top: 0; z-index: 25; background: rgba(251,246,242,.85); backdrop-filter: blur(12px); }
  .nav { height: 78px; display: flex; align-items: center; justify-content: space-between; }
  .brand { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
  .brand strong { font: italic 600 32px var(--serif); color: var(--accent); }
  .brand span { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .links { display: flex; gap: 34px; align-items: center; font-size: 15px; }
  .links a { text-decoration: none; position: relative; }
  .links a:not(.btn)::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 0; height: 1px; background: var(--accent); transition: width .3s; }
  .links a:not(.btn):hover::after { width: 100%; }
  .links .btn { padding: 11px 22px; font-size: 14px; }
  .burger { display: none; background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--ink); }

  /* --- Hero --- */
  .hero { padding: 56px 0 100px; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: center; }
  .hero h1 { font-size: clamp(52px, 8vw, 112px); margin: 20px 0 28px; letter-spacing: -.01em; }
  .hero h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
  .hero h1 .w > span { display: inline-block; transform: translateY(110%); animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { to { transform: none; } }
  .hero p { color: var(--muted); font-size: 19px; max-width: 480px; margin-bottom: 36px; opacity: 0; animation: fadein 1s .9s forwards; }
  .hero .ctas { display: flex; gap: 14px; flex-wrap: wrap; opacity: 0; animation: fadein 1s 1.1s forwards; }
  @keyframes fadein { to { opacity: 1; } }

  .arch-wrap { position: relative; justify-self: center; width: min(420px, 100%); }
  .arch {
    aspect-ratio: 3/4; border-radius: 999px 999px 28px 28px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, var(--blush), color-mix(in srgb, var(--accent) 45%, var(--blush)));
    clip-path: inset(100% 0 0 0 round 999px 999px 28px 28px); animation: archin 1.4s .3s cubic-bezier(.7,0,.2,1) forwards;
  }
  @keyframes archin { to { clip-path: inset(0 0 0 0 round 999px 999px 28px 28px); } }
  .arch img { width: 100%; height: 100%; object-fit: cover; }
  .blob { position: absolute; width: 70%; aspect-ratio: 1; left: 15%; top: 28%; background: radial-gradient(circle at 35% 35%, #fff6, transparent 60%), color-mix(in srgb, var(--gold) 70%, #fff);
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; animation: morph 12s ease-in-out infinite; opacity: .85; filter: blur(.3px); }
  .blob.b2 { width: 46%; left: 40%; top: 8%; background: color-mix(in srgb, var(--accent) 55%, #fff); animation-duration: 15s; animation-direction: reverse; opacity: .6; }
  @keyframes morph {
    0%, 100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: rotate(0deg) translateY(0); }
    50% { border-radius: 63% 37% 39% 61% / 56% 62% 38% 44%; transform: rotate(25deg) translateY(-12px); }
  }
  .badge { position: absolute; width: 150px; height: 150px; left: -60px; bottom: 40px; animation: spin 22s linear infinite; }
  .badge text { font: 500 13px var(--sans); letter-spacing: .32em; text-transform: uppercase; fill: var(--ink); }
  .badge-center { position: absolute; left: -60px; bottom: 40px; width: 150px; height: 150px; display: grid; place-items: center; font: italic 600 34px var(--serif); color: var(--accent); pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spark { position: absolute; width: 18px; height: 18px; color: var(--gold); animation: twinkle 3s ease-in-out infinite; }
  .spark svg { width: 100%; height: 100%; fill: currentColor; }
  @keyframes twinkle { 0%, 100% { transform: scale(.4) rotate(0); opacity: .3; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }

  /* --- Szalag --- */
  .ribbon-clip { overflow: hidden; padding: 24px 0; margin: -24px 0; }
  .ribbon { background: var(--accent); color: #fff; padding: 22px 0; transform: rotate(-2deg); margin: 0 -40px; overflow: hidden; white-space: nowrap; position: relative; z-index: 2; }
  .ribbon-track { display: inline-flex; gap: 40px; animation: marquee 28s linear infinite; font: italic 500 32px var(--serif); }
  .ribbon-track span { display: inline-flex; align-items: center; gap: 40px; }
  .ribbon-track span::after { content: "✦"; font-style: normal; font-size: 18px; color: var(--gold); filter: brightness(1.4); }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* --- Kezelések --- */
  .treat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; perspective: 1000px; }
  .treat {
    background: var(--card); border-radius: 200px 200px 24px 24px; padding: 64px 28px 36px; text-align: center; border: 1px solid var(--line);
    clip-path: circle(0% at 50% 100%); transition: clip-path 1.3s cubic-bezier(.2,.8,.2,1), transform .25s ease, box-shadow .3s;
    transition-delay: var(--d, 0s), 0s, 0s; transform-style: preserve-3d; will-change: transform;
  }
  .treat.in { clip-path: circle(150% at 50% 100%); }
  .treat:hover { box-shadow: 0 30px 50px -30px color-mix(in srgb, var(--accent) 60%, transparent); }
  .treat .ico { font-size: 54px; color: var(--accent); display: inline-block; transform: scale(0) rotate(-120deg); transition: transform 1.2s cubic-bezier(.3,1.6,.4,1); transition-delay: calc(var(--d, 0s) + .45s); }
  .treat.in .ico { transform: none; }
  .treat h3 { font-size: 30px; margin: 16px 0 12px; }
  .treat p { color: var(--muted); font-size: 15px; }

  /* --- Árlista pakli --- */
  .prices { background: var(--blush); overflow: hidden; }
  .deck-area { display: grid; grid-template-columns: 1fr; justify-items: center; }
  .deck { position: relative; width: min(520px, 100%); height: 420px; touch-action: pan-y; user-select: none; }
  .pcard {
    position: absolute; left: 0; right: 0; top: 0; min-height: 100%; background: var(--card); border-radius: 28px; padding: 40px 40px 32px; border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(80,30,40,.35); transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .4s; cursor: grab;
  }
  .pcard.drag { transition: none; cursor: grabbing; }
  .pcard .cat-no { font: 400 12px var(--sans); letter-spacing: .3em; color: var(--gold); text-transform: uppercase; }
  .pcard h3 { font-size: 40px; margin: 6px 0 22px; font-style: italic; color: var(--accent); }
  .pcard ul { list-style: none; }
  .pcard li { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .pcard li .n { font-weight: 400; }
  .pcard li .t { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pcard li .dots { flex: 1; border-bottom: 1px dotted var(--muted); opacity: .4; transform: translateY(-4px); }
  .pcard li .p { font: 600 22px var(--serif); white-space: nowrap; }
  .deck-ctrl { display: flex; align-items: center; gap: 22px; margin-top: 36px; }
  .deck-ctrl button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; transition: background .2s, color .2s; }
  .deck-ctrl button:hover { background: var(--ink); color: #fff; }
  .dots-ind { display: flex; gap: 8px; }
  .dots-ind i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, width .3s; }
  .dots-ind i.on { background: var(--accent); width: 26px; border-radius: 4px; }

  /* --- Rólam --- */
  .about { display: grid; grid-template-columns: .8fr 1.2fr; gap: 80px; align-items: center; }
  .portrait { aspect-ratio: 4/5; border-radius: 999px 999px 24px 24px; overflow: hidden; position: relative;
    background: linear-gradient(200deg, color-mix(in srgb, var(--gold) 40%, var(--blush)), var(--blush)); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .portrait .ph { position: absolute; inset: 0; display: grid; place-items: center; font: italic 600 120px var(--serif); color: #fff; opacity: .8; }
  .about h2 { font-size: clamp(42px, 5vw, 64px); margin: 14px 0 24px; }
  .about p { color: var(--muted); margin-bottom: 18px; max-width: 560px; }
  .sign { font: italic 500 48px var(--serif); color: var(--accent); margin-top: 8px; }

  /* --- Vélemények --- */
  .quotes { position: relative; max-width: 820px; margin: 0 auto; text-align: center; min-height: 220px; }
  .q { position: absolute; inset: 0; opacity: 0; transform: translateY(16px); transition: opacity .8s, transform .8s; pointer-events: none; }
  .q.on { opacity: 1; transform: none; pointer-events: auto; position: relative; }
  .q blockquote { font: italic 500 clamp(28px, 3.6vw, 42px)/1.3 var(--serif); }
  .q cite { display: block; margin-top: 24px; font-style: normal; letter-spacing: .24em; text-transform: uppercase; font-size: 13px; color: var(--gold); }
  .stars { color: var(--gold); letter-spacing: 6px; margin-bottom: 18px; }

  /* --- Kapcsolat --- */
  .contact { background: var(--ink); color: #fff; border-radius: 48px 48px 0 0; }
  .contact .kicker { color: var(--gold); }
  .contact-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 72px; }
  .contact h2 { font-size: clamp(46px, 6vw, 80px); margin: 14px 0 18px; }
  .contact h2 em { color: color-mix(in srgb, var(--accent) 60%, #fff); }
  .contact .lead { color: #cdbdc0; margin-bottom: 36px; }
  .info { list-style: none; display: grid; gap: 18px; font-size: 16px; }
  .info small { display: block; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
  .info a { text-decoration: none; border-bottom: 1px solid #ffffff33; }
  .social { display: flex; gap: 12px; margin-top: 8px; }
  .social a { border: 1px solid #ffffff44; border-radius: 999px; padding: 6px 16px; font-size: 14px; }
  form { display: grid; gap: 18px; background: #ffffff0d; border: 1px solid #ffffff1f; border-radius: 28px; padding: 36px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  label { display: grid; gap: 6px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #cdbdc0; }
  input:not([type=checkbox]), select, textarea {
    background: transparent; border: 0; border-bottom: 1px solid #ffffff44; color: #fff; padding: 10px 2px; font: 300 17px var(--sans); outline: none; transition: border-color .2s;
  }
  select option { color: var(--ink); }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  textarea { min-height: 100px; resize: vertical; }
  .consent { display: flex; gap: 10px; align-items: flex-start; text-transform: none; letter-spacing: 0; font-size: 14px; }

  footer { background: var(--ink); color: #a99598; font-size: 13px; padding: 28px 0 36px; border-top: 1px solid #ffffff14; }

  /* --- Kurzor-csillogás --- */
  #sparkle { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* --- Általános beúszás --- */
  .rv { opacity: 0; transform: translateY(30px); transition: opacity 1s, transform 1s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero h1 .w > span, .hero p, .hero .ctas { transform: none; opacity: 1; }
    .arch { clip-path: none; }
    .treat { clip-path: none; } .treat .ico { transform: none; }

  @media (max-width: 960px) {
    section { padding: 88px 0; }
    .hero-grid, .about, .contact-grid { grid-template-columns: 1fr; gap: 48px; }
    .arch-wrap { width: min(340px, 80%); }
    .treat-grid { grid-template-columns: 1fr 1fr; }
    .portrait { max-width: 380px; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .burger { display: block; }
    .links { display: none; position: absolute; top: 78px; left: 0; right: 0; background: var(--bg); flex-direction: column; align-items: flex-start; padding: 24px 16px; gap: 20px; border-bottom: 1px solid var(--line); }
    .links.open { display: flex; }
    .treat-grid, .row2 { grid-template-columns: 1fr; }
    .pcard { padding: 30px 22px 24px; }
    .pcard h3 { font-size: 34px; }
    .pcard li { flex-wrap: wrap; } .pcard li .dots { display: none; } .pcard li .p { margin-left: auto; }
    .badge, .badge-center { width: 110px; height: 110px; left: -24px; }
    .ribbon-track { font-size: 24px; }
    form { padding: 24px; }
    .contact { border-radius: 32px 32px 0 0; }
  }
</style>
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden>Ez egy <strong>Lydigital</strong> mintaoldal – a szalon és az adatok kitaláltak. <a href="https://lydigital.hu/#sablonok">Ilyet szeretnék →</a></div>

<header>
  <div class="wrap nav">
    <a href="#" class="brand"><strong id="brand-name"></strong><span id="brand-sub"></span></a>
    <button class="burger" aria-label="Menü" onclick="document.querySelector('.links').classList.toggle('open')">☰</button>
    <nav class="links" id="links" onclick="if(event.target.tagName==='A')this.classList.remove('open')"></nav>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap"><span id="foot-left"></span><a class="credit" href="https://lydigital.hu/" target="_blank" rel="noopener">Designed by <strong>Lydigital</strong></a><a href="#">Vissza a tetejére ↑</a></div></footer>

<canvas id="sparkle" aria-hidden="true"></canvas>

<script>
(function () {
  const C = CONFIG, K = C.kapcsolat;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const on = s => s && s.mutat !== false;
  const pad = n => String(n).padStart(2, "0");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z"/></svg>';

  /* --- Alapok --- */
  document.documentElement.style.setProperty("--accent", C.szin);
  document.documentElement.style.setProperty("--gold", C.szin2);
  document.title = C.seoCim;
  document.querySelector('meta[name="description"]').setAttribute("content", C.seoLeiras);
  if (C.demo) document.getElementById("demo-bar").hidden = false;
  document.getElementById("brand-name").textContent = C.nev;
  document.getElementById("brand-sub").textContent = C.alcim;
  document.getElementById("foot-left").textContent = "© " + new Date().getFullYear() + " " + C.nev + " " + C.alcim;

  const ld = { "@context": "https://schema.org", "@type": C.tipus || "BeautySalon", name: (C.nev + " " + C.alcim).trim(), url: C.domain,
    description: C.seoLeiras, telephone: K.telefon, email: K.email,
    address: { "@type": "PostalAddress", streetAddress: K.cim2, addressCountry: "HU" } };
  const sameAs = [K.instagram, K.facebook].filter(Boolean); if (sameAs.length) ld.sameAs = sameAs;
  const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);

  /* --- Hero cím szavanként, *kiemeléssel* --- */
  const toks = [];
  C.hero.cim.split(/(\*[^*]+\*)/).filter(Boolean).forEach(part => {
    const em = part.startsWith("*");
    part.replace(/\*/g, "").split(/\s+/).filter(Boolean).forEach(w => {
      if (/^[.,!?…:;]+$/.test(w) && toks.length) toks[toks.length - 1].tail += w;   // írásjel a előző szóhoz
      else if (!em && /^[.,!?…:;]/.test(w) && toks.length) { const m = w.match(/^[.,!?…:;]+/)[0]; toks[toks.length - 1].tail += m; toks.push({ w: w.slice(m.length), em, tail: "" }); }
      else toks.push({ w, em, tail: "" });
    });
  });
  const heroTitle = toks.filter(t => t.w || t.tail).map((t, i) =>
    `<span class="w"><span style="animation-delay:${(0.15 + i * 0.09).toFixed(2)}s">${t.em ? `<em>${esc(t.w)}</em>` : esc(t.w)}${esc(t.tail)}</span></span>`).join(" ");

  const nav = [], html = [];

  html.push(`
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="kicker">${esc(C.hero.felirat)}</span>
        <h1>${heroTitle}</h1>
        <p>${esc(C.hero.szoveg)}</p>
        <div class="ctas"><a class="btn" href="#idopont">${esc(C.hero.gomb)}</a>${on(C.arlista) ? `<a class="btn ghost" href="#arlista">${esc(C.hero.gomb2)}</a>` : ""}</div>
      </div>
      <div class="arch-wrap">
        <div class="arch">${C.hero.kep ? `<img src="${esc(C.hero.kep)}" alt="${esc(C.nev)}">` : `<div class="blob"></div><div class="blob b2"></div>`}</div>
        <svg class="badge" viewBox="0 0 150 150" aria-hidden="true"><defs><path id="circ" d="M75,75 m-58,0 a58,58 0 1,1 116,0 a58,58 0 1,1 -116,0"/></defs>
          <text><textPath href="#circ">${esc(C.nev)} ✦ ${esc(C.alcim)} ✦ ${esc(C.nev)} ✦ </textPath></text></svg>
        <div class="badge-center" aria-hidden="true">✿</div>
        <span class="spark" style="right:-6px;top:12%;animation-delay:.2s">${STAR}</span>
        <span class="spark" style="right:18%;top:-14px;width:12px;height:12px;animation-delay:1.1s">${STAR}</span>
        <span class="spark" style="left:12%;top:30%;width:14px;height:14px;animation-delay:1.8s">${STAR}</span>
      </div>
    </div>
  </section>`);

  if (C.szalag && C.szalag.length) {
    const items = C.szalag.map(t => `<span>${esc(t)}</span>`).join("");
    html.push(`<div class="ribbon-clip"><div class="ribbon" aria-hidden="true"><div class="ribbon-track">${items}${items}${items}${items}</div></div></div>`);
  }

  nav.push(["kezelesek", C.kezelesek.cim]);
  html.push(`
  <section id="kezelesek">
    <div class="wrap">
      <div class="head rv"><span class="kicker">${esc(C.alcim)}</span><h2>${esc(C.kezelesek.cim)}</h2><p>${esc(C.kezelesek.alcim)}</p></div>
      <div class="treat-grid">${C.kezelesek.elemek.map((k, i) => `
        <article class="treat" style="--d:${(i * 0.15).toFixed(2)}s"><span class="ico">${esc(k.ikon || "✿")}</span><h3>${esc(k.nev)}</h3><p>${esc(k.leiras)}</p></article>`).join("")}
      </div>
    </div>
  </section>`);

  if (on(C.arlista)) {
    nav.push(["arlista", C.arlista.cim]);
    html.push(`
  <section class="prices" id="arlista">
    <div class="wrap">
      <div class="head rv"><span class="kicker">${esc(C.nev)}</span><h2>${esc(C.arlista.cim)}</h2><p>${esc(C.arlista.alcim)}</p></div>
      <div class="deck-area">
        <div class="deck" id="deck" aria-live="polite">${C.arlista.kategoriak.map((k, i) => `
          <div class="pcard" data-i="${i}" role="group" aria-label="${esc(k.nev)}">
            <div class="cat-no">${pad(i + 1)} / ${pad(C.arlista.kategoriak.length)}</div>
            <h3>${esc(k.nev)}</h3>
            <ul>${k.tetelek.map(t => `<li><span class="n">${esc(t.nev)}</span><span class="t">${esc(t.ido)}</span><span class="dots"></span><span class="p">${esc(t.ar)}</span></li>`).join("")}</ul>
          </div>`).join("")}
        </div>
        <div class="deck-ctrl"><button id="prev" aria-label="Előző kártya">←</button><div class="dots-ind" id="dots"></div><button id="next" aria-label="Következő kártya">→</button></div>
      </div>
    </div>
  </section>`);
  }

  if (on(C.rolam)) {
    nav.push(["rolam", "Rólam"]);
    html.push(`
  <section id="rolam">
    <div class="wrap about">
      <div class="portrait rv">${C.rolam.kep ? `<img src="${esc(C.rolam.kep)}" alt="${esc(C.rolam.cim)}" loading="lazy">` : `<div class="ph">${esc((C.rolam.alairas || C.nev)[0])}</div>`}</div>
      <div class="rv">
        <span class="kicker">Rólam</span>
        <h2>${esc(C.rolam.cim)}</h2>
        ${C.rolam.szoveg.map(p => `<p>${esc(p)}</p>`).join("")}
        <div class="sign">${esc(C.rolam.alairas)}</div>
      </div>
    </div>
  </section>`);
  }

  if (on(C.velemenyek)) html.push(`
  <section style="padding-top:40px">
    <div class="wrap">
      <div class="head rv"><span class="kicker">Vélemények</span><h2>${esc(C.velemenyek.cim)}</h2></div>
      <div class="quotes" id="quotes">${C.velemenyek.elemek.map((v, i) => `
        <figure class="q${i === 0 ? " on" : ""}"><div class="stars">★★★★★</div><blockquote>„${esc(v.szoveg)}”</blockquote><cite>${esc(v.nev)}</cite></figure>`).join("")}
      </div>
    </div>
  </section>`);

  const opts = C.kezelesek.elemek.map(k => `<option>${esc(k.nev)}</option>`).join("");
  const hours = (K.nyitvatartas || []).map(h => esc(h)).join("<br>");
  const social = [K.instagram && `<a href="${esc(K.instagram)}" target="_blank" rel="noopener">Instagram</a>`, K.facebook && `<a href="${esc(K.facebook)}" target="_blank" rel="noopener">Facebook</a>`].filter(Boolean).join("");
  const titleParts = K.cim.split(" "); const lastW = titleParts.pop();
  html.push(`
  <section class="contact" id="idopont">
    <div class="wrap contact-grid">
      <div>
        <span class="kicker">Időpontkérés</span>
        <h2>${esc(titleParts.join(" "))} <em>${esc(lastW)}</em></h2>
        <p class="lead">${esc(K.szoveg)}</p>
        <ul class="info">
          ${K.telefon ? `<li><small>Telefon</small><a href="tel:${esc(K.telefon.replace(/\s/g, ""))}">${esc(K.telefon)}</a></li>` : ""}
          ${K.email ? `<li><small>E-mail</small><a href="mailto:${esc(K.email)}">${esc(K.email)}</a></li>` : ""}
          ${K.cim2 ? `<li><small>Cím</small>${K.terkepLink ? `<a href="${esc(K.terkepLink)}" target="_blank" rel="noopener">${esc(K.cim2)}</a>` : esc(K.cim2)}</li>` : ""}
          ${hours ? `<li><small>Nyitvatartás</small>${hours}</li>` : ""}
          ${social ? `<li class="social">${social}</li>` : ""}
        </ul>
      </div>
      <form id="form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="${esc(K.web3formsKulcs)}">
        <input type="hidden" name="subject" value="${esc(K.urlapTargy + " – " + C.nev)}">
        <input type="hidden" name="from_name" value="${esc(C.nev + " weboldal")}">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
        <div class="row2">
          <label>Név *<input type="text" name="Név" required autocomplete="name"></label>
          <label>Telefon *<input type="tel" name="Telefon" required autocomplete="tel"></label>
        </div>
        <label>E-mail *<input type="email" name="email" required autocomplete="email"></label>
        <div class="row2">
          <label>Kezelés *<select name="Kezelés" required><option value="">Válassz…</option>${opts}<option>Még nem tudom</option></select></label>
          <label>Mikor lenne jó?<input type="text" name="Időpont" placeholder="pl. jövő kedd délután"></label>
        </div>
        <label>Megjegyzés<textarea name="Megjegyzés"></textarea></label>
        <label class="consent"><input type="checkbox" required> Hozzájárulok, hogy adataimat az időpont egyeztetése céljából kezeljék.</label>
        <div><button class="btn" id="send" type="submit">Időpontot kérek</button></div>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </div>
  </section>`);

  document.getElementById("app").innerHTML = html.join("");
  document.getElementById("links").innerHTML = nav.map(([id, t]) => `<a href="#${id}">${esc(t)}</a>`).join("") + `<a class="btn" href="#idopont">${esc(C.hero.gomb)}</a>`;

  /* --- Beúszás + virágnyílás --- */
  // (a kezeléskártyák a rácsukkal együtt nyílnak – a clip-path miatt a rácsot figyeljük)
  const reveal = el => { el.classList.add("in"); if (el.classList.contains("treat-grid")) el.querySelectorAll(".treat").forEach(t => t.classList.add("in")); };
  const targets = document.querySelectorAll(".rv, .treat-grid");
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } }), { threshold: 0.15 });
    targets.forEach(t => io.observe(t));
  } else targets.forEach(reveal);

  /* --- 3D billenés a kezeléskártyákon --- */
  if (!reduce && matchMedia("(pointer: fine)").matches) {
    document.querySelectorAll(".treat").forEach(card => {
      card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        card.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) translateZ(10px)`;
      });
      card.addEventListener("mouseleave", () => card.style.transform = "");
    });
  }

  /* --- Árlista kártyapakli --- */
  if (on(C.arlista)) {
    const deck = document.getElementById("deck");
    const cards = [...deck.querySelectorAll(".pcard")];
    const dots = document.getElementById("dots");
    dots.innerHTML = cards.map(() => "<i></i>").join("");
    let order = cards.map((_, i) => i);
    function layout() {
      order.forEach((ci, pos) => {
        const c = cards[ci];
        c.style.zIndex = cards.length - pos;
        c.style.transform = pos === 0 ? "none" : `translateY(${pos * 16}px) scale(${1 - pos * 0.045}) rotate(${pos % 2 ? 2.5 : -2.5}deg)`;
        c.style.opacity = pos > 3 ? 0 : 1;
        c.setAttribute("aria-hidden", pos === 0 ? "false" : "true");
      });
      [...dots.children].forEach((d, i) => d.classList.toggle("on", i === order[0]));
    }
    function next(dir = 1) {
      const top = cards[order[0]];
      top.style.transform = `translateX(${dir * 120}%) rotate(${dir * 18}deg)`;
      top.style.opacity = 0;
      setTimeout(() => { order.push(order.shift()); layout(); }, reduce ? 0 : 280);
    }
    function prev() { order.unshift(order.pop()); layout(); }
    document.getElementById("next").onclick = () => next(1);
    document.getElementById("prev").onclick = prev;
    let sx = 0, dx = 0, dragging = null;
    deck.addEventListener("pointerdown", e => {
      const c = e.target.closest(".pcard"); if (!c || +c.dataset.i !== order[0]) return;
      dragging = c; sx = e.clientX; dx = 0; c.classList.add("drag"); c.setPointerCapture(e.pointerId);
    });
    deck.addEventListener("pointermove", e => {
      if (!dragging) return; dx = e.clientX - sx;
      dragging.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    });
    const end = () => {
      if (!dragging) return; dragging.classList.remove("drag");
      const c = dragging; dragging = null;
      if (Math.abs(dx) > 90) next(dx > 0 ? 1 : -1); else c.style.transform = "none";
    };
    deck.addEventListener("pointerup", end); deck.addEventListener("pointercancel", end);
    const fit = () => { deck.style.height = Math.max(...cards.map(c => c.scrollHeight)) + 8 + "px"; };
    fit(); addEventListener("resize", fit); document.fonts && document.fonts.ready.then(fit);
    layout();
  }

  /* --- Vélemények váltakozása --- */
  if (on(C.velemenyek)) {
    const qs = [...document.querySelectorAll("#quotes .q")]; let qi = 0;
    if (qs.length > 1 && !reduce) setInterval(() => { qs[qi].classList.remove("on"); qi = (qi + 1) % qs.length; qs[qi].classList.add("on"); }, 5500);
  }

  /* --- Kurzor-csillogás (csak egérrel, asztali gépen) --- */
  const cv = document.getElementById("sparkle");
  if (!reduce && matchMedia("(pointer: fine)").matches && cv.getContext) {
    const ctx = cv.getContext("2d"); let W, H, parts = [], raf = null, lastSpawn = 0;
    const resize = () => { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    resize(); addEventListener("resize", resize);
    const cols = [C.szin2, C.szin, "#ffffff"];
    function star(x, y, r, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r); ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r);
      ctx.fill(); ctx.restore();
    }
    function loop() {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(p => { p.t += 1 / 60; p.y += p.vy; p.x += p.vx; const k = 1 - p.t / p.life;
        ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = p.c; star(p.x, p.y, p.r * (0.4 + k * 0.6), p.rot + p.t * 3); });
      parts = parts.filter(p => p.t < p.life);
      raf = parts.length ? requestAnimationFrame(loop) : null;
    }
    addEventListener("mousemove", e => {
      const now = performance.now(); if (now - lastSpawn < 40) return; lastSpawn = now;
      parts.push({ x: e.clientX + (Math.random() - .5) * 10, y: e.clientY + (Math.random() - .5) * 10, vx: (Math.random() - .5) * .6, vy: Math.random() * .6 + .2,
        r: Math.random() * 5 + 3, rot: Math.random() * 3, c: cols[Math.floor(Math.random() * cols.length)], t: 0, life: .9 });
      if (parts.length > 40) parts.shift();
      if (!raf) raf = requestAnimationFrame(loop);
    });
  }

  /* --- Űrlap (Web3Forms) --- */
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, b = document.getElementById("send"), m = document.getElementById("msg");
    b.disabled = true; m.className = "msg";
    try {
      const fd = new FormData(f); fd.set("replyto", fd.get("email") || "");
      const r = await fetch(f.action, { method: "POST", headers: { Accept: "application/json" }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.success) throw new Error(d.message || "HTTP " + r.status);
      f.reset(); m.className = "msg ok"; m.textContent = "Köszönöm! Hamarosan visszaigazolom az időpontot.";
    } catch (err) {
      m.className = "msg err"; m.textContent = "Hiba történt a küldés közben. Kérlek, próbáld újra, vagy hívj telefonon.";
    } finally { b.disabled = false; }
  });
})();
</script>
</body>
</html>

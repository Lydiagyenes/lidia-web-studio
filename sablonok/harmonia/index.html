<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #5f7f6b;
    --sand: #d9a77f;
    --bg: #f6f2ea;
    --card: #fffdf8;
    --ink: #2e3530;
    --muted: #6f776f;
    --line: #e4ddd0;
    --serif: "Lora", Georgia, serif;
    --sans: "Manrope", system-ui, sans-serif;
    --max: 1140px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font: 400 17px/1.75 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.15; }
  em { font-style: italic; color: var(--accent); }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; position: relative; }
  section { padding: 110px 0; position: relative; }
  .kicker { font: 500 13px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .head { max-width: 620px; margin-bottom: 56px; }
  .head.center { margin-left: auto; margin-right: auto; text-align: center; }
  .head h2 { font-size: clamp(36px, 4.6vw, 56px); margin: 12px 0 14px; }
  .head p { color: var(--muted); }

  /* --- Lebegő színfoltok a háttérben --- */
  .orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; animation: drift 28s ease-in-out infinite alternate; }
  .orb.o1 { width: 520px; height: 520px; background: color-mix(in srgb, var(--accent) 55%, #fff); left: -160px; top: -120px; }
  .orb.o2 { width: 460px; height: 460px; background: color-mix(in srgb, var(--sand) 70%, #fff); right: -140px; top: 30vh; animation-duration: 34s; }
  .orb.o3 { width: 380px; height: 380px; background: color-mix(in srgb, var(--accent) 25%, var(--sand)); left: 30vw; bottom: -180px; animation-duration: 40s; opacity: .3; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(80px, 60px) scale(1.12); } 100% { transform: translate(-40px, 120px) scale(.95); } }

  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 15px 28px; border-radius: 999px; border: 0;
    background: var(--accent); color: #fff; font: 500 15px var(--sans); text-decoration: none; cursor: pointer;
    transition: transform .3s, box-shadow .3s, background .3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px var(--accent); }
  .btn.soft { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .btn.soft:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: none; }

  .demo-bar { background: var(--accent); color: #fff; font-size: 13px; text-align: center; padding: 9px 16px; }
  .demo-bar a { color: #fff; font-weight: 600; margin-left: 8px; white-space: nowrap; }
  .demo-bar[hidden] { display: none; }

  /* --- Header --- */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(14px); }
  .nav { height: 76px; display: flex; align-items: center; justify-content: space-between; }
  .brand { text-decoration: none; line-height: 1.2; }
  .brand strong { display: block; font: 500 22px var(--serif); }
  .brand span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .links { display: flex; gap: 30px; align-items: center; font-size: 15px; }
  .links a { text-decoration: none; color: var(--muted); transition: color .2s; }
  .links a:hover { color: var(--ink); }
  .links .btn { color: #fff; padding: 11px 20px; font-size: 14px; }
  .burger { display: none; background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--ink); }

  /* --- Hero --- */
  .hero { padding: 70px 0 110px; }
  .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 56px; align-items: center; }
  .hero h1 { font-size: clamp(44px, 6.4vw, 82px); margin: 18px 0 24px; }
  .hero p { color: var(--muted); font-size: 19px; max-width: 520px; margin-bottom: 34px; }
  .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .fade { opacity: 0; transform: translateY(18px); animation: up 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }

  .breath { position: relative; width: min(380px, 100%); aspect-ratio: 1; justify-self: center; display: grid; place-items: center; }
  .breath .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); animation: breathe 10s ease-in-out infinite; }
  .breath .ring.r2 { inset: 12%; animation-delay: .4s; border-color: color-mix(in srgb, var(--sand) 60%, transparent); }
  .breath .core {
    width: 56%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 55%), linear-gradient(140deg, color-mix(in srgb, var(--accent) 70%, #fff), color-mix(in srgb, var(--sand) 80%, #fff));
    box-shadow: 0 30px 60px -20px color-mix(in srgb, var(--accent) 50%, transparent);
    animation: breathe 10s ease-in-out infinite;
  }
  .breath .say { position: absolute; bottom: -8px; left: 0; right: 0; text-align: center; font: italic 500 18px var(--serif); color: var(--muted); }
  .breath .say span { position: absolute; left: 0; right: 0; animation: sayIn 10s ease-in-out infinite; }
  .breath .say span + span { animation-name: sayOut; }
  @keyframes breathe { 0%, 100% { transform: scale(.78); } 40%, 50% { transform: scale(1); } }
  @keyframes sayIn { 0%, 40% { opacity: 1; } 45%, 95% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes sayOut { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }

  /* --- Csomagok --- */
  .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: stretch; }
  .pack { background: var(--card); border-radius: 32px; padding: 34px 30px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; transition: transform .4s, box-shadow .4s; }
  .pack:hover { transform: translateY(-6px); box-shadow: 0 30px 50px -36px rgba(30,50,40,.45); }
  .pack.hot { background: var(--accent); color: #fff; border-color: transparent; }
  .pack.hot p, .pack.hot .meta { color: #ffffffcc; }
  .pack .tag { align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 4px 12px; border-radius: 999px; background: #ffffff26; }
  .pack h3 { font-size: 27px; }
  .pack p { color: var(--muted); flex: 1; }
  .pack .price { font: 500 26px var(--serif); }
  .pack .meta { font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
  .pack .btn { justify-content: center; margin-top: 6px; }
  .pack.hot .btn { background: #fff; color: var(--accent); }
  .pack.pulse { animation: pulse 1.6s ease-out 1; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sand) 80%, transparent); } 100% { box-shadow: 0 0 0 26px transparent; } }

  /* --- Kvíz --- */
  .quiz-box { background: var(--card); border-radius: 40px; padding: 56px; border: 1px solid var(--line); max-width: 820px; margin: 0 auto; position: relative; overflow: hidden; min-height: 400px; }
  .progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 36px; }
  .progress i { width: 40px; height: 4px; border-radius: 4px; background: var(--line); transition: background .5s; }
  .progress i.on { background: var(--accent); }
  .qstep { animation: qin .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes qin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  .qstep h3 { font-size: clamp(26px, 3vw, 34px); text-align: center; margin-bottom: 30px; }
  .answers { display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
  .answers button {
    text-align: left; padding: 18px 24px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: 500 16px var(--sans); cursor: pointer; transition: border-color .25s, background .25s, transform .25s; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .answers button::after { content: "→"; color: var(--accent); opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .25s; }
  .answers button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); transform: translateX(4px); }
  .answers button:hover::after { opacity: 1; transform: none; }
  .result { text-align: center; }
  .result .intro { color: var(--muted); }
  .result h3 { font-size: clamp(32px, 4vw, 46px); margin: 10px 0 12px; color: var(--accent); }
  .result p.d { max-width: 520px; margin: 0 auto 10px; }
  .result .meta { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
  .result .ctas { justify-content: center; }
  .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; animation: float 2.4s ease-out forwards; }
  @keyframes float { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-180px) scale(.3); opacity: 0; } }

  /* --- Folyamat (kirajzolódó vonal) --- */
  .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding-top: 70px; }
  .steps svg { position: absolute; top: 0; left: 0; width: 100%; height: 100px; overflow: visible; }
  .steps path { fill: none; stroke: var(--sand); stroke-width: 2; stroke-linecap: round; }
  .step .dot { width: 54px; height: 54px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font: 500 20px var(--serif); color: var(--accent); margin-bottom: 18px; position: relative; z-index: 1; }
  .step h3 { font-size: 23px; margin-bottom: 8px; }
  .step p { color: var(--muted); }

  /* --- Rólam --- */
  .about { display: grid; grid-template-columns: .85fr 1.15fr; gap: 72px; align-items: center; }
  .portrait { aspect-ratio: 4/5; border-radius: 46% 54% 42% 58% / 52% 40% 60% 48%; overflow: hidden; position: relative; animation: blob 18s ease-in-out infinite;
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 45%, #fff), color-mix(in srgb, var(--sand) 70%, #fff)); }
  @keyframes blob { 50% { border-radius: 58% 42% 55% 45% / 42% 56% 44% 58%; } }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .portrait .ph { position: absolute; inset: 0; display: grid; place-items: center; font: italic 500 110px var(--serif); color: #fff; opacity: .85; }
  .about h2 { font-size: clamp(36px, 4.6vw, 56px); margin: 12px 0 22px; }
  .about p { color: var(--muted); margin-bottom: 16px; }
  .creds { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; list-style: none; }
  .creds li { padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }

  /* --- Vélemények --- */
  .quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .quote { background: var(--card); border-radius: 32px; padding: 40px; border: 1px solid var(--line); }
  .quote blockquote { font: italic 500 22px/1.5 var(--serif); }
  .quote cite { display: block; margin-top: 18px; font-style: normal; font-size: 14px; color: var(--muted); }

  /* --- GYIK --- */
  .faq { max-width: 820px; display: grid; gap: 12px; }
  .faq details { background: var(--card); border-radius: 24px; padding: 0 28px; border: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; padding: 22px 0; font: 500 19px var(--serif); display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; color: var(--accent); font: 300 26px/1 var(--sans); transition: transform .3s; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { color: var(--muted); padding-bottom: 22px; }

  /* --- Kapcsolat --- */
  .contact-box { background: var(--card); border-radius: 44px; padding: 60px; border: 1px solid var(--line); display: grid; grid-template-columns: .9fr 1.1fr; gap: 56px; }
  .contact h2 { font-size: clamp(36px, 4.4vw, 54px); margin: 12px 0 16px; }
  .contact .lead { color: var(--muted); margin-bottom: 28px; }
  .info { list-style: none; display: grid; gap: 12px; }
  .info small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .info a { text-decoration: none; }
  .crisis { margin-top: 28px; font-size: 14px; padding: 16px 18px; border-radius: 18px; background: color-mix(in srgb, var(--sand) 18%, var(--card)); color: var(--ink); }
  form { display: grid; gap: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
  input:not([type=checkbox]):not([type=radio]), select, textarea {
    width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 400 16px var(--sans); outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
  textarea { min-height: 110px; resize: vertical; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { display: inline-flex; flex-direction: row; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-weight: 400; }
  .seg input { accent-color: var(--accent); }
  .consent { display: flex; flex-direction: row; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--muted); }
  .consent input { accent-color: var(--accent); margin-top: 5px; }
  .hp { position: absolute; left: -9999px; }
  .msg { display: none; padding: 12px 16px; border-radius: 14px; font-size: 15px; }
  .msg.ok { display: block; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .msg.err { display: block; background: #fde2e2; color: #9b1c1c; }

  footer { padding: 30px 0 40px; font-size: 13px; color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a { text-decoration: none; }
  footer .credit strong { color: var(--ink); font-weight: 600; transition: color .2s; }
  footer .credit:hover strong { color: var(--accent); }

  .rv { opacity: 0; transform: translateY(28px); transition: opacity 1.1s, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .fade, .rv { opacity: 1; transform: none; }
    .breath .say span + span { display: none; }
  }
  @media (max-width: 960px) {
    section { padding: 80px 0; }
    .hero-grid, .about, .contact-box, .quotes { grid-template-columns: 1fr; gap: 40px; }
    .packs { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr; padding-top: 0; }
    .steps svg { display: none; }
    .breath { width: min(300px, 80%); }
    .portrait { max-width: 360px; }
    .quiz-box, .contact-box { padding: 36px 24px; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .burger { display: block; }
    .links { display: none; position: absolute; top: 76px; left: 0; right: 0; background: var(--bg); flex-direction: column; align-items: flex-start; padding: 24px 16px; gap: 18px; }
    .links.open { display: flex; }
    .row2 { grid-template-columns: 1fr; }
    .quiz-box { border-radius: 28px; }
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div class="demo-bar" id="demo-bar" hidden>Ez egy <strong>Lydigital</strong> mintaoldal – a személy és az adatok kitaláltak. <a href="https://lydigital.hu/#sablonok">Ilyet szeretnék →</a></div>

<header>
  <div class="wrap nav">
    <a href="#" class="brand"><strong id="brand-name"></strong><span id="brand-sub"></span></a>
    <button class="burger" aria-label="Menü" onclick="document.querySelector('.links').classList.toggle('open')">☰</button>
    <nav class="links" id="links" onclick="if(event.target.tagName==='A')this.classList.remove('open')"></nav>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap"><span id="foot-left"></span><a class="credit" href="https://lydigital.hu/" target="_blank" rel="noopener">Designed by <strong>Lydigital</strong></a><a href="#">Vissza a tetejére ↑</a></div></footer>

<script>
(function () {
  const C = CONFIG, K = C.kapcsolat, P = C.csomagok.elemek;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const on = s => s && s.mutat !== false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const emph = t => esc(t).replace(/\*([^*]+)\*/g, "<em>$1</em>");

  document.documentElement.style.setProperty("--accent", C.szin);
  document.documentElement.style.setProperty("--sand", C.szin2);
  document.title = C.seoCim;
  document.querySelector('meta[name="description"]').setAttribute("content", C.seoLeiras);
  if (C.demo) document.getElementById("demo-bar").hidden = false;
  document.getElementById("brand-name").textContent = C.nev;
  document.getElementById("brand-sub").textContent = C.alcim;
  document.getElementById("foot-left").textContent = "© " + new Date().getFullYear() + " " + C.nev;

  const graph = [{ "@type": C.tipus || "ProfessionalService", name: C.nev + " – " + C.alcim, url: C.domain, description: C.seoLeiras, telephone: K.telefon, email: K.email,
    makesOffer: P.map(p => ({ "@type": "Offer", itemOffered: { "@type": "Service", name: p.nev, description: p.leiras }, description: p.ar })) }];
  if (on(C.gyik)) graph.push({ "@type": "FAQPage", mainEntity: C.gyik.elemek.map(f => ({ "@type": "Question", name: f.k, acceptedAnswer: { "@type": "Answer", text: f.v } })) });
  const ldS = document.createElement("script"); ldS.type = "application/ld+json"; ldS.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": graph }); document.head.appendChild(ldS);

  const nav = [], html = [];

  html.push(`
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="kicker fade">${esc(C.hero.felirat)}</span>
        <h1 class="fade" style="animation-delay:.15s">${emph(C.hero.cim)}</h1>
        <p class="fade" style="animation-delay:.35s">${esc(C.hero.szoveg)}</p>
        <div class="ctas fade" style="animation-delay:.55s"><a class="btn" href="#kapcsolat">${esc(C.hero.gomb)}</a>${on(C.kviz) ? `<a class="btn soft" href="#kviz">${esc(C.hero.gomb2)}</a>` : ""}</div>
      </div>
      ${C.hero.legzes ? `<div class="breath fade" style="animation-delay:.4s" aria-hidden="true"><div class="ring"></div><div class="ring r2"></div><div class="core"></div><div class="say"><span>Lélegezz be…</span><span>…és ki.</span></div></div>` : ""}
    </div>
  </section>`);

  nav.push(["csomagok", "Együttműködés"]);
  html.push(`
  <section id="csomagok" style="padding-top:40px">
    <div class="wrap">
      <div class="head rv"><span class="kicker">Lehetőségek</span><h2>${esc(C.csomagok.cim)}</h2></div>
      <div class="packs">${P.map((p, i) => `
        <article class="pack rv${p.kiemelt ? " hot" : ""}" id="pack-${i}" style="transition-delay:${i * 0.12}s">
          ${p.kiemelt ? `<span class="tag">Legnépszerűbb</span>` : ""}
          <h3>${esc(p.nev)}</h3><p>${esc(p.leiras)}</p>
          <div class="price">${esc(p.ar)}</div>
          <div class="meta"><span>${esc(p.ido)}</span><span>${esc(p.jelleg)}</span></div>
          <a class="btn${p.kiemelt ? "" : " soft"}" href="#kapcsolat" data-pick="${i}">Ezt választom</a>
        </article>`).join("")}
      </div>
    </div>
  </section>`);

  if (on(C.kviz)) {
    nav.push(["kviz", "Kvíz"]);
    html.push(`
  <section id="kviz">
    <div class="wrap">
      <div class="head center rv"><span class="kicker">Mini kvíz</span><h2>${esc(C.kviz.cim)}</h2><p>${esc(C.kviz.alcim)}</p></div>
      <div class="quiz-box rv" id="quiz"></div>
    </div>
  </section>`);
  }

  if (on(C.folyamat)) html.push(`
  <section>
    <div class="wrap">
      <div class="head rv"><span class="kicker">Folyamat</span><h2>${esc(C.folyamat.cim)}</h2></div>
      <div class="steps" id="steps">
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path id="wave" d="M27,27 C180,90 250,-30 375,27 S600,90 720,27 S900,-20 1000,40"/></svg>
        ${C.folyamat.lepesek.map((l, i) => `<div class="step rv" style="transition-delay:${i * 0.2}s"><div class="dot">${i + 1}</div><h3>${esc(l.cim)}</h3><p>${esc(l.szoveg)}</p></div>`).join("")}
      </div>
    </div>
  </section>`);

  if (on(C.rolam)) {
    nav.push(["rolam", "Rólam"]);
    html.push(`
  <section id="rolam">
    <div class="wrap about">
      <div class="portrait rv">${C.rolam.kep ? `<img src="${esc(C.rolam.kep)}" alt="${esc(C.nev)}" loading="lazy">` : `<div class="ph">${esc(C.nev.split(" ").map(w => w[0]).join(""))}</div>`}</div>
      <div class="rv">
        <span class="kicker">${esc(C.rolam.cim)}</span>
        <h2>${esc(C.nev)}</h2>
        ${C.rolam.szoveg.map(p => `<p>${esc(p)}</p>`).join("")}
        <ul class="creds">${C.rolam.vegzettsegek.map(v => `<li>${esc(v)}</li>`).join("")}</ul>
      </div>
    </div>
  </section>`);
  }

  if (on(C.velemenyek)) html.push(`
  <section style="padding-top:20px">
    <div class="wrap">
      <div class="head rv"><span class="kicker">Vélemények</span><h2>${esc(C.velemenyek.cim)}</h2></div>
      <div class="quotes">${C.velemenyek.elemek.map(v => `<figure class="quote rv"><blockquote>„${esc(v.szoveg)}”</blockquote><cite>— ${esc(v.nev)}</cite></figure>`).join("")}</div>
    </div>
  </section>`);

  if (on(C.gyik)) {
    nav.push(["gyik", "GYIK"]);
    html.push(`
  <section id="gyik" style="padding-top:20px">
    <div class="wrap">
      <div class="head rv"><span class="kicker">GYIK</span><h2>${esc(C.gyik.cim)}</h2></div>
      <div class="faq rv">${C.gyik.elemek.map((f, i) => `<details${i === 0 ? " open" : ""}><summary>${esc(f.k)}</summary><p>${esc(f.v)}</p></details>`).join("")}</div>
    </div>
  </section>`);
  }

  html.push(`
  <section class="contact" id="kapcsolat">
    <div class="wrap">
      <div class="contact-box rv">
        <div>
          <span class="kicker">Kapcsolat</span>
          <h2>${emph(K.cim)}</h2>
          <p class="lead">${esc(K.szoveg)}</p>
          <ul class="info">
            ${K.telefon ? `<li><small>Telefon</small><a href="tel:${esc(K.telefon.replace(/\s/g, ""))}">${esc(K.telefon)}</a></li>` : ""}
            ${K.email ? `<li><small>E-mail</small><a href="mailto:${esc(K.email)}">${esc(K.email)}</a></li>` : ""}
            ${K.cim2 ? `<li><small>Helyszín</small>${esc(K.cim2)}</li>` : ""}
          </ul>
          ${K.krizis ? `<p class="crisis">${esc(K.krizis)}</p>` : ""}
        </div>
        <form id="form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="${esc(K.web3formsKulcs)}">
          <input type="hidden" name="subject" value="${esc(K.urlapTargy + " – " + C.nev)}">
          <input type="hidden" name="from_name" value="${esc(C.nev + " weboldal")}">
          <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
          <div class="row2">
            <label>Név *<input type="text" name="Név" required autocomplete="name"></label>
            <label>E-mail *<input type="email" name="email" required autocomplete="email"></label>
          </div>
          <label>Melyik forma érdekel?<select name="Csomag" id="pack-select"><option value="">Még nem tudom</option>${P.map(p => `<option>${esc(p.nev)}</option>`).join("")}</select></label>
          <div><span style="font-size:14px;font-weight:500">Hogyan lenne kényelmes?</span>
            <div class="seg" style="margin-top:6px">
              <label><input type="radio" name="Forma" value="Online" checked> Online</label>
              <label><input type="radio" name="Forma" value="Személyesen"> Személyesen</label>
              <label><input type="radio" name="Forma" value="Mindegy"> Mindegy</label>
            </div>
          </div>
          <label>Üzenet<textarea name="Üzenet" placeholder="Ha szeretnéd, írd le röviden, miben kérnél támogatást. (Nem kötelező.)"></textarea></label>
          <label class="consent"><input type="checkbox" required> Hozzájárulok, hogy adataimat a kapcsolatfelvétel céljából bizalmasan kezeljék.</label>
          <div><button class="btn" id="send" type="submit">Küldés</button></div>
          <div class="msg" id="msg" role="status"></div>
        </form>
      </div>
    </div>
  </section>`);

  document.getElementById("app").innerHTML = html.join("");
  document.getElementById("links").innerHTML = nav.map(([id, t]) => `<a href="#${id}">${esc(t)}</a>`).join("") + `<a class="btn" href="#kapcsolat">Kapcsolat</a>`;

  /* --- Csomag kiválasztása → űrlap előtöltése --- */
  const pick = i => { const sel = document.getElementById("pack-select"); if (sel && P[i]) sel.value = P[i].nev; };
  document.addEventListener("click", e => { const a = e.target.closest("[data-pick]"); if (a) pick(+a.dataset.pick); });

  /* --- Beúszás --- */
  const els = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.15 });
    els.forEach(el => io.observe(el));
  } else els.forEach(el => el.classList.add("in"));

  /* --- Hullámvonal kirajzolása görgetésre --- */
  const wave = document.getElementById("wave");
  if (wave) {
    const len = wave.getTotalLength(); wave.style.strokeDasharray = len; wave.style.strokeDashoffset = reduce ? 0 : len;
    if (!reduce) {
      const steps = document.getElementById("steps");
      const draw = () => { const r = steps.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight - r.top) / (innerHeight * 0.7)));
        wave.style.strokeDashoffset = len * (1 - p); };
      addEventListener("scroll", draw, { passive: true }); draw();
    }
  }

  /* --- Kvíz --- */
  if (on(C.kviz)) {
    const Q = C.kviz.kerdesek, box = document.getElementById("quiz");
    let step = 0, score = P.map(() => 0);
    const progress = () => `<div class="progress">${Q.map((_, i) => `<i class="${i < step || step >= Q.length ? "on" : ""}${i === step ? " on" : ""}"></i>`).join("")}</div>`;
    function render() {
      if (step < Q.length) {
        const q = Q[step];
        box.innerHTML = progress() + `<div class="qstep"><h3>${esc(q.k)}</h3><div class="answers">${q.valaszok.map((a, i) => `<button type="button" data-a="${i}">${esc(a.v)}</button>`).join("")}</div></div>`;
      } else {
        const best = score.indexOf(Math.max(...score)), p = P[best];
        box.innerHTML = progress() + `<div class="qstep result"><p class="intro">${esc(C.kviz.eredmenyBevezeto)}</p><h3>${esc(p.nev)}</h3><p class="d">${esc(p.leiras)}</p>
          <p class="meta">${esc(p.ar)} · ${esc(p.ido)} · ${esc(p.jelleg)}</p>
          <div class="ctas"><a class="btn" href="#kapcsolat" data-pick="${best}">${esc(C.kviz.gomb)}</a><button class="btn soft" type="button" id="restart">${esc(C.kviz.ujra)}</button></div></div>`;
        document.getElementById("restart").onclick = () => { step = 0; score = P.map(() => 0); render(); };
        if (!reduce) {
          for (let i = 0; i < 18; i++) { const d = document.createElement("span"); d.className = "confetti";
            d.style.cssText = `left:${10 + Math.random() * 80}%;top:${55 + Math.random() * 35}%;background:${i % 2 ? C.szin : C.szin2};animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px`;
            box.appendChild(d); setTimeout(() => d.remove(), 3200); }
          const card = document.getElementById("pack-" + best); if (card) { card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse"); }
        }
      }
    }
    box.addEventListener("click", e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      Q[step].valaszok[+b.dataset.a].pont.forEach((v, i) => score[i] += v || 0);
      step++; render();
    });
    render();
  }

  /* --- Űrlap (Web3Forms) --- */
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, b = document.getElementById("send"), m = document.getElementById("msg");
    b.disabled = true; m.className = "msg";
    try {
      const fd = new FormData(f); fd.set("replyto", fd.get("email") || "");
      const r = await fetch(f.action, { method: "POST", headers: { Accept: "application/json" }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.success) throw new Error(d.message || "HTTP " + r.status);
      f.reset(); m.className = "msg ok"; m.textContent = "Köszönöm, hogy írtál! Hamarosan jelentkezem.";
    } catch (err) {
      m.className = "msg err"; m.textContent = "Hiba történt a küldés közben. Kérlek, próbáld újra, vagy írj e-mailt.";
    } finally { b.disabled = false; }
  });
})();
</script>
</body>
</html>
